name: TestFlightの内部テスター管理

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'check：接続確認、plan：変更予定、invite：招待送信、sync：承諾済みユーザーを追加'
        type: choice
        default: check
        options: [check, plan, invite, sync]
  schedule:
    - cron: '7,22,37,52 * * * *'
  pull_request:
    paths: ['Scripts/TestFlight/**', '.github/workflows/testflight-invitations.yml']
  push:
    branches: [main]
    paths: ['Scripts/TestFlight/**', '.github/workflows/testflight-invitations.yml']

permissions:
  contents: read

jobs:
  verify:
    name: 招待処理の検証
    if: github.event_name != 'schedule' || vars.TESTFLIGHT_SYNC_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: コードを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.jsを準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 検証用の依存を準備
        working-directory: Scripts/TestFlight
        run: npm ci --ignore-scripts
      - name: 型検査とテストを実行
        working-directory: Scripts/TestFlight
        run: npm test

  manage:
    name: Apple側の招待状態を確認・更新
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && vars.TESTFLIGHT_SYNC_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: testflight-zli-invitations
      cancel-in-progress: false
    steps:
      - name: コードを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.jsを準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 招待処理を実行
        env:
          TESTFLIGHT_OPERATION: ${{ github.event_name == 'schedule' && 'sync' || inputs.operation }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          TESTFLIGHT_INVITEES_JSON: ${{ secrets.TESTFLIGHT_INVITEES_JSON }}
        run: node Scripts/TestFlight/manage.mjs
