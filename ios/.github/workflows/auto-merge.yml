name: レビュー通過後の自動マージ

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize, edited]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 自動マージを有効にするPR番号
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  enable:
    name: PRの自動マージを有効化
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
    steps:
      # 理由：書き込み権限のある処理でPR側のコードを実行せず、GitHubの保護条件に判定を委ねるため。
      - name: 最新のPR状態を確認して自動マージを予約
        shell: bash
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo 'PR番号が不正です。' >&2
            exit 1
          fi
          pr=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
          if ! jq -e --arg repo "$GH_REPO" \
            '.state == "open" and .draft == false and .base.ref == "main" and .head.repo.full_name == $repo' \
            <<< "$pr" > /dev/null; then
            echo '同じリポジトリのmain向け通常PRだけを対象にします。'
            exit 0
          fi
          head_sha=$(jq -r '.head.sha' <<< "$pr")
          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --auto --merge \
            --match-head-commit "$head_sha" \
            --subject "PR #${PR_NUMBER} を自動マージする" \
            --body '必須の承認とチェックを満たしたため、自動マージします。'
