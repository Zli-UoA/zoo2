name: Zoo
options:
  bundleIdPrefix: works.zli
  developmentLanguage: ja
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '13'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: F82XB5KFX2
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    exactVersion: 1.7.3
  ZooCrypto:
    path: ZooCrypto
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 157.0.0
targets:
  Zoo:
    type: application
    platform: iOS
    sources: [Sources, Shared, WatchShared, CallActivityShared]
    dependencies:
      - package: SwiftMath
      - package: WebRTC
      - package: ZooCrypto
      - target: ZooNotificationService
        embed: true
      - target: ZooWatch
        embed: true
      - target: ZooCallActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.zli.zoo
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS: Zoo.entitlements
        APNS_ENVIRONMENT: development
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_CFBundleDisplayName: Zoo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # App Store Connectで書類不要と確認した申告内容を保つ（docs/e2ee.md）。
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      configs:
        Release:
          APNS_ENVIRONMENT: production
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: 他のユーザーの検証で、相手の画面の QR コードを読み取るためにカメラを使います。
        NSMicrophoneUsageDescription: チャンネルやDMの音声通話でマイクを使用します。
        NSLocalNetworkUsageDescription: 同じWi-Fiに接続している通話相手と音声を直接送受信します。
        NSSiriUsageDescription: SiriからZooのDM送信・下書き・音声通話を使うため、メンバー名と依頼内容をSiriと共有します。
        NSSupportsLiveActivities: true
        INIntentsSupported: [INSendMessageIntent]
        INIntentsRestrictedWhileLocked: [INSendMessageIntent]
        INIntentsRestrictedWhileProtectedDataUnavailable: [INSendMessageIntent]
        NSPhotoLibraryAddUsageDescription: アップロードされた画像や動画を写真に保存します。
        UIBackgroundModes: [audio, voip]
        APNSEnvironment: $(APNS_ENVIRONMENT)
        ZooPreviewKeychainGroup: $(AppIdentifierPrefix)works.zli.zoo.preview
        UILaunchStoryboardName: LaunchScreen
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  ZooCallActivity:
    type: app-extension
    platform: iOS
    sources: [CallActivityExtension, CallActivityShared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.zli.zoo.call-activity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: CallActivity-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Zooの通話
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ZooNotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService, Shared]
    dependencies:
      - package: ZooCrypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.zli.zoo.notification-service
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: NotificationService.entitlements
    info:
      path: NotificationService-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Zoo
        ZooPreviewKeychainGroup: $(AppIdentifierPrefix)works.zli.zoo.preview
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  ZooWatch:
    type: application
    platform: watchOS
    deploymentTarget: '26.0'
    sources: [WatchApp, WatchShared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.zli.zoo.watchkitapp
        SUPPORTED_PLATFORMS: watchos watchsimulator
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Watch-Info.plist
      properties:
        CFBundleDisplayName: Zoo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: works.zli.zoo
        WKRunsIndependentlyOfCompanionApp: false
  ZooTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Zoo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  ZooUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Zoo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1,2'
schemes:
  ZooWatch:
    build:
      targets:
        ZooWatch: all
  Zoo:
    build:
      targets:
        Zoo: all
    test:
      targets: [ZooTests, ZooUITests]
      gatherCoverageData: true
