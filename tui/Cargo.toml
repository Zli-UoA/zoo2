[package]
name = "zoo2-tui"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
directories = "6"


[dev-dependencies]
wiremock = "0.6"

[lib]
name = "zoo2_tui"
path = "src/lib.rs"

[[bin]]
name = "zoo2-tui"
path = "src/main.rs"
