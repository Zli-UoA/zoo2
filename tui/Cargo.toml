[package]
name = "zoo2-tui"
version = "0.1.0"
edition = "2024"
description = "zoo2 をターミナルから使うチャットクライアント"
homepage = "https://github.com/Zli-UoA/zoo2/tree/main/tui"
repository = "https://github.com/Zli-UoA/zoo2"
readme = "README.md"

[profile.release]
strip = true

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
directories = "6"
jiff = "0.2"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
tui-textarea = "0.7"
unicode-segmentation = "1.13"
unicode-width = "0.2"
emojis = "0.6"
uuid = { version = "1", features = ["v4"] }


# リリース用の .deb と .rpm。CD TUI Release で musl の静的バイナリから作る。
# `--target` を付けると、`target/release` は `target/<triple>/release` に読み替えられる。
[package.metadata.deb]
maintainer = "Zli-UoA <https://github.com/Zli-UoA>"
section = "net"
extended-description = "ターミナルで zoo2 のチャンネルを読み書きする TUI クライアント。AuthZ のデバイスコードでログインする。"
assets = [
    ["target/release/zoo2-tui", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/zoo2-tui/README.md", "644"],
]

[package.metadata.generate-rpm]
license = "Proprietary"
auto-req = "disabled"
assets = [
    { source = "target/release/zoo2-tui", dest = "/usr/bin/zoo2-tui", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/zoo2-tui/README.md", mode = "644", doc = true },
]

[dev-dependencies]
wiremock = "0.6"

[lib]
name = "zoo2_tui"
path = "src/lib.rs"

[[bin]]
name = "zoo2-tui"
path = "src/main.rs"
