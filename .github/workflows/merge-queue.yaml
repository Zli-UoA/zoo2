name: Merge queue

# マージキューの各エントリーで、main と合わせた状態の CI を実行する。
# automerge-gate は merge_group に対応していないため、必須チェックの
# automerge-gate/all-passed はこの workflow の all-passed ジョブが付ける。
on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: merge-queue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # キューの base からの差分に当てはまる CI だけを実行する（.github/scripts/merge-queue-changes.mjs）。
  changes:
    # merge_group でしか動かず、キューに入った PR のコードを扱うので、常に GitHub-hosted で実行する。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci-backend: ${{ steps.match.outputs.ci-backend }}
      ci-frontend: ${{ steps.match.outputs.ci-frontend }}
      ci-frontend-auth-e2e: ${{ steps.match.outputs.ci-frontend-auth-e2e }}
      ci-compose: ${{ steps.match.outputs.ci-compose }}
      ci-tui: ${{ steps.match.outputs.ci-tui }}
      ci-github-bot: ${{ steps.match.outputs.ci-github-bot }}
      ci-flux-status: ${{ steps.match.outputs.ci-flux-status }}
      terraform-r2: ${{ steps.match.outputs.terraform-r2 }}
    steps:
      - uses: actions/checkout@v7
      - id: match
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: node .github/scripts/merge-queue-changes.mjs

  ci-backend:
    needs: changes
    if: needs.changes.outputs.ci-backend == 'true'
    uses: ./.github/workflows/ci-backend.yaml
    secrets: inherit

  ci-frontend:
    needs: changes
    if: needs.changes.outputs.ci-frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yaml
    secrets: inherit

  ci-frontend-auth-e2e:
    needs: changes
    if: needs.changes.outputs.ci-frontend-auth-e2e == 'true'
    uses: ./.github/workflows/ci-frontend-auth-e2e.yaml
    secrets: inherit

  ci-compose:
    needs: changes
    if: needs.changes.outputs.ci-compose == 'true'
    uses: ./.github/workflows/ci-compose.yaml
    secrets: inherit

  ci-tui:
    needs: changes
    if: needs.changes.outputs.ci-tui == 'true'
    uses: ./.github/workflows/ci-tui.yaml
    secrets: inherit

  ci-github-bot:
    needs: changes
    if: needs.changes.outputs.ci-github-bot == 'true'
    uses: ./.github/workflows/ci-github-bot.yaml
    secrets: inherit
    # publish ジョブは main でだけ動くが、宣言している権限を呼び出し側でも許す必要がある。
    permissions:
      contents: read
      packages: write

  ci-flux-status:
    needs: changes
    if: needs.changes.outputs.ci-flux-status == 'true'
    uses: ./.github/workflows/ci-flux-status.yaml
    secrets: inherit

  terraform-r2:
    needs: changes
    if: needs.changes.outputs.terraform-r2 == 'true'
    uses: ./.github/workflows/terraform-r2.yaml
    secrets: inherit

  all-passed:
    needs:
      - changes
      - ci-backend
      - ci-frontend
      - ci-frontend-auth-e2e
      - ci-compose
      - ci-tui
      - ci-github-bot
      - ci-flux-status
      - terraform-r2
    if: ${{ !cancelled() }}
    # merge_group でしか動かず、キューに入った PR のコードを扱うので、常に GitHub-hosted で実行する。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v9
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const failed = Object.entries(needs)
              .filter(([, job]) => !['success', 'skipped'].includes(job.result))
              .map(([name]) => name);
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: failed.length ? 'failure' : 'success',
              context: 'automerge-gate/all-passed',
              description: failed.length ? `Failed: ${failed.join(', ')}`.slice(0, 140) : 'All merge queue checks passed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (failed.length) core.setFailed(`Failed: ${failed.join(', ')}`);
