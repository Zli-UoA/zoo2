name: CI Frontend
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "infra/Dockerfile-frontend-deploy*"
      - "infra/frontend-nginx.conf"
      - "infra/Dockerfile-proxy-deploy*"
      - "infra/proxy/**"
      - "infra/compose.stg*.yaml"
      - ".github/workflows/ci-frontend.yaml"
      - ".github/workflows/select-runner.yaml"
  pull_request:
    paths:
      - "frontend/**"
      - "infra/Dockerfile-frontend-deploy*"
      - "infra/frontend-nginx.conf"
      - "infra/Dockerfile-proxy-deploy*"
      - "infra/proxy/**"
      - "infra/compose.stg*.yaml"
      - ".github/workflows/ci-frontend.yaml"
      - ".github/workflows/select-runner.yaml"
  workflow_dispatch:
    inputs:
      runner:
        description: Runner selection (auto prefers a compatible idle self-hosted runner)
        type: choice
        options: [auto, github, self-hosted]
        default: auto
permissions:
  contents: read
jobs:
  select-runner:
    uses: ./.github/workflows/select-runner.yaml
    with:
      mode: ${{ inputs.runner || 'auto' }}
    secrets:
      runner-status-token: ${{ secrets.RUNNER_STATUS_TOKEN }}
  container:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.docker) }}
    timeout-minutes: 40
    env:
      POSTGRES_PASSWORD: container-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and start frontend
        run: docker compose --project-directory . -f infra/compose.stg.yaml up -d --build --wait --wait-timeout 60 frontend

      - name: Check SPA routes and security headers
        run: |
          for path in "/" "/channels/container-test"; do
            headers=$(docker compose --project-directory . -f infra/compose.stg.yaml exec -T frontend \
              wget -S -O - "http://127.0.0.1:3000${path}" 2>&1)
            printf "%s" "$headers" | grep -q "<html"
            printf "%s" "$headers" | grep -qi "X-Content-Type-Options: nosniff"
            printf "%s" "$headers" | grep -qi "Referrer-Policy: strict-origin-when-cross-origin"
            printf "%s" "$headers" | grep -qi "X-Frame-Options: DENY"
          done

      - name: Missing assets must not fall back to index.html
        run: |
          if docker compose --project-directory . -f infra/compose.stg.yaml exec -T frontend \
            wget -q -O /dev/null http://127.0.0.1:3000/assets/missing-container-test.js; then
            echo "missing asset returned a successful response" >&2
            exit 1
          fi

      - name: Container logs
        if: failure()
        run: |
          docker compose --project-directory . -f infra/compose.stg.yaml logs frontend
          docker compose --project-directory . -f infra/compose.stg.yaml ps -aq frontend |
            xargs -r docker inspect --format '{{json .State.Health}}'

      - name: Stop frontend
        if: always()
        run: docker compose --project-directory . -f infra/compose.stg.yaml down

  proxy:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.docker) }}
    timeout-minutes: 40
    env:
      POSTGRES_PASSWORD: proxy-test
      PROXY_PORT: 18080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build proxy
        run: docker compose --project-directory . -f infra/compose.stg.yaml build proxy
      - name: Start proxy with mock frontend and Rust
        run: docker compose --project-directory . -f infra/compose.stg.yaml -f infra/proxy/test/compose.yaml up -d --no-build --no-deps --wait frontend backend proxy
      - name: Check routing, header stripping, and streaming
        run: node infra/proxy/test/check.mjs
      - name: Logs
        if: failure()
        run: docker compose --project-directory . -f infra/compose.stg.yaml -f infra/proxy/test/compose.yaml logs
      - name: Stop containers
        if: always()
        run: docker compose --project-directory . -f infra/compose.stg.yaml -f infra/proxy/test/compose.yaml down

  check:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.node) }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: format / lint / typecheck
        run: pnpm check

      - name: build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: i18n browser tests
        run: pnpm test:e2e:i18n

  unit-test:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.node) }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: unit test
        run: pnpm test
