name: CI Frontend
on:
  # merge-queue.yaml がマージキューで呼び出す。
  workflow_call:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      # frontend が link: 依存で読む E2EE の wasm（@zoo/crypto-wasm）。
      - "crates/zoo-crypto/**"
      - "crates/zoo-crypto-wasm/**"
      - "rust-toolchain.toml"
      - "infra/Dockerfile-frontend-deploy*"
      - "infra/frontend-nginx.conf"
      - "infra/csp-hashes.mjs"
      - "infra/frontend-entrypoint.sh"
      - "infra/Dockerfile-proxy-deploy*"
      - "infra/proxy/**"
      - "infra/compose.stack*.yaml"
      - ".github/workflows/ci-frontend.yaml"
      - ".github/workflows/select-runner.yaml"
  pull_request:
    paths:
      - "frontend/**"
      # frontend が link: 依存で読む E2EE の wasm（@zoo/crypto-wasm）。
      - "crates/zoo-crypto/**"
      - "crates/zoo-crypto-wasm/**"
      - "rust-toolchain.toml"
      - "infra/Dockerfile-frontend-deploy*"
      - "infra/frontend-nginx.conf"
      - "infra/csp-hashes.mjs"
      - "infra/frontend-entrypoint.sh"
      - "infra/Dockerfile-proxy-deploy*"
      - "infra/proxy/**"
      - "infra/compose.stack*.yaml"
      - ".github/workflows/ci-frontend.yaml"
      - ".github/workflows/select-runner.yaml"
  workflow_dispatch:
concurrency:
  group: ci-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# runner ジョブがDocker不要用とDocker必須用の実行先を選びます。
jobs:
  runner:
    uses: ./.github/workflows/select-runner.yaml
    secrets:
      runner-status-token: ${{ secrets.RUNNER_STATUS_TOKEN }}

  container:
    needs: runner
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.docker-runs-on || '"ubuntu-latest"') }}
    env:
      POSTGRES_PASSWORD: container-test
      # envsubst で CSP に埋め込まれることを確認するためのダミー IdP・ストレージオリジン。
      CSP_CONNECT_SRC: https://id.example
      CSP_STORAGE_SRC: https://storage.example
      CSP_AVATAR_SRC: https://avatars.example
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # The self-hosted runner image already has the system libraries.
      - name: Install Playwright browser
        working-directory: ./frontend
        run: pnpm exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: default-load=true

      # docker compose build の type=gha が、Actions のキャッシュサービスに接続するために要る。
      - name: Expose the Actions cache runtime to docker
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Build and start frontend
        run: |
          files=(-f infra/compose.stack.yaml -f infra/compose.ci-cache.yaml)
          if [ "$GITHUB_REF" = refs/heads/main ]; then files+=(-f infra/compose.ci-cache-write.yaml); fi
          docker compose --project-directory . "${files[@]}" up -d --build --wait --wait-timeout 60 frontend

      - name: Check SPA routes and security headers
        run: |
          worker=$(docker compose --project-directory . -f infra/compose.stack.yaml exec -T frontend \
            find /usr/share/nginx/html/assets -name 'opfs-worker-*.js')
          test -n "$worker"
          for path in "/" "/channels/container-test" "${worker#/usr/share/nginx/html}"; do
            headers=$(docker compose --project-directory . -f infra/compose.stack.yaml exec -T frontend \
              wget -S -O - "http://127.0.0.1:3000${path}" 2>&1)
            case "$path" in /assets/*) ;; *) printf "%s" "$headers" | grep -q "<html" ;; esac
            printf "%s" "$headers" | grep -qi "X-Content-Type-Options: nosniff"
            printf "%s" "$headers" | grep -qi "Referrer-Policy: strict-origin-when-cross-origin"
            printf "%s" "$headers" | grep -qi "X-Frame-Options: DENY"
            printf "%s" "$headers" | grep -qi "Content-Security-Policy:"
            # script はビルド時のインライン script ハッシュで許可し、unsafe-inline は使わない。
            printf "%s" "$headers" | grep -q "script-src 'self' 'wasm-unsafe-eval' 'sha256-"
            printf "%s" "$headers" | grep -q "connect-src 'self' data:"
            # Compose disabled: its image-fetch origins must not widen connect-src.
            connect=$(printf "%s" "$headers" | sed -n 's/.*connect-src \([^;]*\).*/\1/p')
            case "$connect" in *www.gstatic.com*) echo "Compose CSP leaked into a React-only image" >&2; exit 1 ;; esac
            # Emoji Kitchen の合成画像（#82）とストレージオリジンを許可する。
            printf "%s" "$headers" | grep -q "img-src 'self' data: blob: https://www.gstatic.com https://storage.example"
            images=$(printf "%s" "$headers" | sed -n 's/.*img-src \([^;]*\).*/\1/p')
            printf '%s\n' "$images" | tr ' ' '\n' | grep -Fxq 'https://avatars.example'
            for origin in https://id.example https://storage.example https://avatars.example; do
              printf '%s\n' "$connect" | tr ' ' '\n' | grep -Fxq "$origin"
            done
            case "$images $connect" in *avater.zliusercontent.com*) echo "Avatar CSP override was ignored" >&2; exit 1 ;; esac
          done

      - name: Check default avatar CSP in image and Compose
        run: |
          image=$(docker compose --project-directory . -f infra/compose.stack.yaml images -q frontend)
          docker image inspect "$image" --format '{{json .Config.Env}}' |
            python3 -c 'import json,sys; assert "CSP_AVATAR_SRC=https://avater.zliusercontent.com" in json.load(sys.stdin)'
          env -u CSP_AVATAR_SRC docker compose --project-directory . -f infra/compose.stack.yaml config --format json |
            python3 -c 'import json,sys; assert json.load(sys.stdin)["services"]["frontend"]["environment"]["CSP_AVATAR_SRC"] == "https://avater.zliusercontent.com"'
          default_csp_container="zoo2-default-csp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$default_csp_container" >/dev/null' EXIT
          docker run -d --name "$default_csp_container" "$image"
          for attempt in $(seq 1 30); do
            if docker exec "$default_csp_container" wget -Y off -q -O /dev/null http://127.0.0.1:3000/; then break; fi
            sleep 1
          done
          worker=$(docker exec "$default_csp_container" find /usr/share/nginx/html/assets -name 'opfs-worker-*.js')
          test -n "$worker"
          for path in "/" "/channels/default-csp" "${worker#/usr/share/nginx/html}"; do
            headers=$(docker exec "$default_csp_container" wget -Y off -S -O - "http://127.0.0.1:3000${path}" 2>&1)
            images=$(printf "%s" "$headers" | sed -n 's/.*img-src \([^;]*\).*/\1/p')
            printf '%s\n' "$images" | tr ' ' '\n' | grep -Fxq 'https://avater.zliusercontent.com'
            connections=$(printf "%s" "$headers" | sed -n 's/.*connect-src \([^;]*\).*/\1/p')
            printf '%s\n' "$connections" | tr ' ' '\n' | grep -Fxq 'https://avater.zliusercontent.com'
          done

      - name: Check Emoji Kitchen catalog compression and caching
        run: |
          catalog=$(docker compose --project-directory . -f infra/compose.stack.yaml exec -T frontend \
            find /usr/share/nginx/html/assets -name 'emoji-kitchen-*.json')
          test -n "$catalog"
          headers=$(docker compose --project-directory . -f infra/compose.stack.yaml exec -T frontend \
            wget -S -O /dev/null --header 'Accept-Encoding: gzip' \
            "http://127.0.0.1:3000${catalog#/usr/share/nginx/html}" 2>&1)
          printf "%s" "$headers" | grep -qi "Content-Type: application/json"
          printf "%s" "$headers" | grep -qi "Content-Encoding: gzip"
          printf "%s" "$headers" | grep -qi "Vary: Accept-Encoding"
          printf "%s" "$headers" | grep -qi "Cache-Control: public, max-age=31536000, immutable"

      - name: Missing assets must not fall back to index.html
        run: |
          if docker compose --project-directory . -f infra/compose.stack.yaml exec -T frontend \
            wget -q -O /dev/null http://127.0.0.1:3000/assets/missing-container-test.js; then
            echo "missing asset returned a successful response" >&2
            exit 1
          fi

      # compose はホストにポートを公開しないため、検証用に同じイメージを 3100 で起動する。
      - name: Start frontend for CSP browser test
        run: |
          docker run --rm -d --name zoo-frontend-csp-test \
            -p 127.0.0.1:3100:3000 -e CSP_CONNECT_SRC=https://id.example -e CSP_STORAGE_SRC=https://storage.example \
            "${FRONTEND_IMAGE:-zoo-frontend:stg}"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "frontend for CSP test did not become ready" >&2
          exit 1

      - name: CSP browser test
        working-directory: ./frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3100
        run: pnpm test:e2e:csp

      - name: Container logs
        if: failure()
        run: |
          docker compose --project-directory . -f infra/compose.stack.yaml logs frontend
          docker logs zoo-frontend-csp-test 2>/dev/null || true
          docker compose --project-directory . -f infra/compose.stack.yaml ps -aq frontend |
            xargs -r docker inspect --format '{{json .State.Health}}'

      - name: Stop frontend
        if: always()
        run: |
          docker rm -f zoo-frontend-csp-test 2>/dev/null || true
          docker compose --project-directory . -f infra/compose.stack.yaml down

  proxy:
    needs: runner
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.docker-runs-on || '"ubuntu-latest"') }}
    env:
      POSTGRES_PASSWORD: proxy-test
      PROXY_PORT: 18080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: default-load=true

      # docker compose build の type=gha が、Actions のキャッシュサービスに接続するために要る。
      - name: Expose the Actions cache runtime to docker
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Build proxy
        run: |
          files=(-f infra/compose.stack.yaml -f infra/compose.ci-cache.yaml)
          if [ "$GITHUB_REF" = refs/heads/main ]; then files+=(-f infra/compose.ci-cache-write.yaml); fi
          docker compose --project-directory . "${files[@]}" build proxy
      - name: Start proxy with mock frontend and Rust
        run: docker compose --project-directory . -f infra/compose.stack.yaml -f infra/proxy/test/compose.yaml up -d --no-build --no-deps --wait frontend backend proxy
      - name: Check routing, header stripping, and streaming
        run: node infra/proxy/test/check.mjs
      - name: Logs
        if: failure()
        run: docker compose --project-directory . -f infra/compose.stack.yaml -f infra/proxy/test/compose.yaml logs
      - name: Stop containers
        if: always()
        run: docker compose --project-directory . -f infra/compose.stack.yaml -f infra/proxy/test/compose.yaml down

  # E2EE の wasm（crates/zoo-crypto-wasm/pkg）を 1 回だけ作り、check・unit-test・browser-test に渡す。
  crypto-wasm:
    needs: runner
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.runs-on || '"zli-kubecamp-no-docker"') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Rust toolchain and wasm-bindgen version
        id: versions
        run: |
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "wasm-bindgen=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/zoo-crypto-wasm/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.channel }}
          targets: wasm32-unknown-unknown
      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          # キャッシュの保存は main だけにする。PR ごとに数百 MB ずつ保存すると、容量の上限（10GB）を超えて、main のキャッシュも追い出される。
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: crates/zoo-crypto-wasm
      # cargo install は毎回ソースからビルドして約90秒かかるので、版ごとにバイナリーをキャッシュする。
      - name: Restore wasm-bindgen-cli
        id: wasm-bindgen-cli
        uses: actions/cache@v6
        with:
          path: ~/.cargo-tools
          key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-wasm-bindgen-cli-${{ steps.versions.outputs.wasm-bindgen }}
      - name: Install wasm-bindgen-cli
        # crates/zoo-crypto-wasm/Cargo.toml で = 固定した wasm-bindgen と同じ版にする（build.sh が照合する）。
        if: steps.wasm-bindgen-cli.outputs.cache-hit != 'true'
        run: cargo install --locked --root "$HOME/.cargo-tools" wasm-bindgen-cli --version "${{ steps.versions.outputs.wasm-bindgen }}"
      - name: Add cached tools to PATH
        run: echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"
      - name: Build wasm package
        run: crates/zoo-crypto-wasm/build.sh
      - name: Upload wasm package
        uses: actions/upload-artifact@v7
        with:
          name: zoo-crypto-wasm
          path: crates/zoo-crypto-wasm/pkg
          if-no-files-found: error
          retention-days: 1

  check:
    needs: crypto-wasm
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || 'zli-kubecamp-no-docker' }}
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download wasm package
        uses: actions/download-artifact@v8
        with:
          name: zoo-crypto-wasm
          path: crates/zoo-crypto-wasm/pkg

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Storybook catalog audit
        run: pnpm check:storybook

      - name: format / lint / typecheck
        run: pnpm check

      - name: build
        run: pnpm build

  unit-test:
    needs: crypto-wasm
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || 'zli-kubecamp-no-docker' }}
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download wasm package
        uses: actions/download-artifact@v8
        with:
          name: zoo-crypto-wasm
          path: crates/zoo-crypto-wasm/pkg

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: unit test
        run: |
          pnpm test
          pnpm test:pwa

  browser-test:
    needs: [runner, crypto-wasm]
    # Storybook exceeds the 2GiB kubecamp limit, even with a single test page.
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.large-runs-on || '"zli-k8s"') }}
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download wasm package
        uses: actions/download-artifact@v8
        with:
          name: zoo-crypto-wasm
          path: crates/zoo-crypto-wasm/pkg

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # The self-hosted runner image already has the system libraries.
      - name: Install Playwright Firefox and Chromium
        run: pnpm exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} firefox chromium

      - name: Avatar cache Service Worker browser test
        run: node scripts/avatar-cache.test.mjs

      - name: SQLite CSP cold and warm cache tests
        run: |
          pnpm test:csp:offline
          node scripts/offline-csp.test.mjs --warm

      - name: i18n browser tests
        run: pnpm test:e2e:i18n

      - name: Retired Compose selection falls back to React
        working-directory: frontend
        run: pnpm exec playwright test --config playwright.frontend-selection.config.ts

      - name: Upload frontend selection failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-selection-failure
          path: frontend/test-results/frontend-selection/
          retention-days: 7
          if-no-files-found: ignore

      - name: Message layout browser tests
        run: pnpm test:e2e:layout

      - name: browser test
        run: pnpm test:browser

      - name: vrt
        run: pnpm test:vrt

      - name: storybook test
        run: pnpm test:storybook --run --maxWorkers=1 --fileParallelism=false

      - name: build storybook
        run: pnpm build-storybook

      - name: Upload Storybook static catalog
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: frontend/storybook-static
          retention-days: 7
          if-no-files-found: error

      - name: Upload VRT failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-vrt-artifacts
          path: frontend/.vitest/attachments
          if-no-files-found: ignore
