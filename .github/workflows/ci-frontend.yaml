name: CI Frontend
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "infra/Dockerfile-frontend-deploy*"
      - "infra/Dockerfile-proxy-deploy*"
      - "infra/proxy/**"
      - "infra/compose.stg*.yaml"
      - ".github/workflows/ci-frontend.yaml"
  pull_request:
    paths:
      - "frontend/**"
      - "infra/Dockerfile-frontend-deploy*"
      - "infra/Dockerfile-proxy-deploy*"
      - "infra/proxy/**"
      - "infra/compose.stg*.yaml"
      - ".github/workflows/ci-frontend.yaml"
  workflow_dispatch:
jobs:
  container:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: container-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and start frontend
        run: docker compose --project-directory . -f infra/compose.stg.yaml up -d --build --wait --wait-timeout 60 frontend

      - name: Check SSR routes
        run: |
          docker compose --project-directory . -f infra/compose.stg.yaml exec -T frontend node --input-type=module -e '
            for (const path of ["/", "/channels/container-test"]) {
              const response = await fetch(`http://localhost:3000${path}`);
              if (response.status !== 200) process.exit(1);
            }
          '

      - name: Container logs
        if: failure()
        run: docker compose --project-directory . -f infra/compose.stg.yaml logs frontend

      - name: Stop frontend
        if: always()
        run: docker compose --project-directory . -f infra/compose.stg.yaml down

  proxy:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: proxy-test
      PROXY_PORT: 18080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build proxy
        run: docker compose --project-directory . -f infra/compose.stg.yaml build proxy
      - name: Start proxy with mock BFF and Rust
        run: docker compose --project-directory . -f infra/compose.stg.yaml -f infra/proxy/test/compose.yaml up -d --no-build --no-deps --wait frontend backend proxy
      - name: Check auth boundary and streaming
        run: node infra/proxy/test/check.mjs
      - name: Logs
        if: failure()
        run: docker compose --project-directory . -f infra/compose.stg.yaml -f infra/proxy/test/compose.yaml logs
      - name: Stop containers
        if: always()
        run: docker compose --project-directory . -f infra/compose.stg.yaml -f infra/proxy/test/compose.yaml down

  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: format / lint / typecheck
        run: pnpm check

      - name: build
        run: pnpm build

  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: unit test
        run: pnpm test
