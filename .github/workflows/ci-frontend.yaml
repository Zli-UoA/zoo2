name: CI Frontend
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "infra/Dockerfile-frontend-deploy*"
      - "infra/compose.stg.yaml"
      - ".github/workflows/ci-frontend.yaml"
  pull_request:
    paths:
      - "frontend/**"
      - "infra/Dockerfile-frontend-deploy*"
      - "infra/compose.stg.yaml"
      - ".github/workflows/ci-frontend.yaml"
  workflow_dispatch:
jobs:
  container:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: container-test
      VITE_API_BASE_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and start frontend
        run: docker compose --project-directory . -f infra/compose.stg.yaml up -d --build --wait --wait-timeout 60 frontend

      - name: Check SSR routes
        run: |
          curl --fail http://localhost:5173/ -o /dev/null
          curl --fail http://localhost:5173/channels/container-test -o /dev/null

      - name: Container logs
        if: failure()
        run: docker compose --project-directory . -f infra/compose.stg.yaml logs frontend

      - name: Stop frontend
        if: always()
        run: docker compose --project-directory . -f infra/compose.stg.yaml down

  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: format / lint / typecheck
        run: pnpm check

      - name: build
        run: pnpm build

  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: unit test
        run: pnpm test
