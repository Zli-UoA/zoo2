name: OpenTofu R2

# PR では plan の結果をコメントし、main へのマージで apply します（infra/terraform/README.md）。
on:
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-r2.yaml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-r2.yaml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: infra/terraform

env:
  # flake.nix の開発シェルの opentofu と同じ版
  TOFU_VERSION: "1.13.1"

jobs:
  validate:
    name: Validate
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'zli-kubecamp-no-docker' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Check Formatting
        run: tofu fmt -check

      - name: Initialize OpenTofu
        run: tofu init -backend=false

      - name: Validate Configuration
        run: tofu validate

  plan:
    name: Plan
    needs: [validate]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'zli-kubecamp-no-docker' }}
    if: github.event_name == 'pull_request'
    concurrency:
      group: terraform-r2-plan-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_AWS_SECRET_ACCESS_KEY }}
      TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # fork PR には Secrets が渡らないので plan を skip します。
      - name: Check Secrets
        id: check_secrets
        working-directory: .
        run: |
          if [ -n "$TF_VAR_cloudflare_api_token" ] && [ -n "$TF_VAR_cloudflare_account_id" ] \
            && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] && [ -n "$TF_VAR_state_passphrase" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare or state secrets are not configured (e.g. fork PR). Skipping plan."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Initialize OpenTofu
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: tofu init -input=false

      # plan は state を書き換えないので、ロックを取らず apply を待たせません。
      - name: OpenTofu Plan
        id: plan
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          set +e
          tofu plan -input=false -no-color -lock=false -concise 2>&1 | tee "$RUNNER_TEMP/plan.txt"
          code=${PIPESTATUS[0]}
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Comment Plan
        if: ${{ !cancelled() && steps.plan.outputs.exitcode != '' }}
        uses: actions/github-script@v9
        env:
          PLAN_LOG: ${{ runner.temp }}/plan.txt
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
          TOFU_DIR: infra/terraform
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- tofu-plan:${process.env.TOFU_DIR} -->`;
            const output = fs.readFileSync(process.env.PLAN_LOG, 'utf8');
            const ok = process.env.PLAN_EXITCODE === '0';
            const summary = output.split('\n').find(l => /^(Plan:|No changes\.|Error:)/.test(l)) ?? '';
            // コメントは 65536 文字まで。
            const limit = 60000;
            const shown = output.length > limit ? `${output.slice(0, limit)}\n…（以降は省略。全体はログにあります）` : output;
            const pr = context.payload.pull_request;
            const log = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### OpenTofu plan: \`${process.env.TOFU_DIR}\``,
              '',
              `${ok ? '✅' : '❌'} ${summary || 'plan が失敗しました'}（${pr.head.sha.slice(0, 7)}、[ログ](${log})）`,
              '',
              '<details><summary>出力</summary>',
              '',
              '```text',
              shown.trimEnd(),
              '```',
              '',
              '</details>',
              '',
              'マージすると、main でもう一度 plan してから `tofu apply` します。',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr.number });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            }

  apply:
    name: Apply
    needs: [validate]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'zli-kubecamp-no-docker' }}
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # apply は 1 つずつ実行し、途中で取り消しません。
    concurrency:
      group: terraform-r2-apply
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_AWS_SECRET_ACCESS_KEY }}
      TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # skip ではなく失敗させ、マージが apply されていないことを main に残します。
      - name: Check Secrets
        working-directory: .
        run: |
          if [ -z "$TF_VAR_cloudflare_api_token" ] || [ -z "$TF_VAR_cloudflare_account_id" ] \
            || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$TF_VAR_state_passphrase" ]; then
            echo "::error::Cloudflare or state secrets are not configured. Nothing was applied; set them and re-run this workflow on main."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Initialize OpenTofu
        run: tofu init -input=false

      - name: OpenTofu Apply
        run: tofu apply -input=false -no-color -auto-approve -lock-timeout=10m
