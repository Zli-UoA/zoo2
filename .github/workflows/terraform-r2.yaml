name: OpenTofu R2

on:
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-r2.yaml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-r2.yaml"
  workflow_dispatch:

defaults:
  run:
    working-directory: infra/terraform

jobs:
  validate:
    name: Validate
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'zli-kubecamp-no-docker' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.11.14"

      - name: Check Formatting
        run: tofu fmt -check

      - name: Initialize OpenTofu
        run: tofu init -backend=false

      - name: Validate Configuration
        run: tofu validate

  plan:
    name: Plan
    needs: [validate]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'zli-kubecamp-no-docker' }}
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] \
            && [ -n "${{ secrets.TF_STATE_AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.TF_STATE_AWS_SECRET_ACCESS_KEY }}" ] \
            && [ -n "${{ secrets.TF_STATE_PASSPHRASE }}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare or state secrets are not configured (e.g. fork PR). Skipping plan."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup OpenTofu
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.11.14"

      - name: Initialize OpenTofu
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_AWS_SECRET_ACCESS_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
        run: tofu init -input=false

      - name: OpenTofu Plan
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_AWS_SECRET_ACCESS_KEY }}
          TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: tofu plan -input=false -lock=false -no-color

  # NOTE:
  # remote backend (R2 の zcp-terraform-state) は設定済みですが、state の移行（infra/terraform/README.md）が
  # 済むまで CI での自動 apply は無効化しています。移行後に手元で plan が差分なしになることを確認してから有効化してください。
  # apply:
  #   name: Apply
  #   needs: validate
  #   ...

