name: Publish images
on:
  push:
    branches: [main]
  pull_request:
    # labeled publishes the tags a PR opened before the preview existed may lack.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
permissions:
  contents: read
# Serialize runs per branch or PR only. Cleanup defers untagged deletion while any run is active.
concurrency:
  group: ghcr-images-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  queue: max
# runner ジョブがDocker不要用とDocker必須用の実行先を選びます。
jobs:
  runner:
    uses: ./.github/workflows/select-runner.yaml
    secrets:
      runner-status-token: ${{ secrets.RUNNER_STATUS_TOKEN }}

  plan:
    needs: runner
    if: >-
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(needs.runner.outputs.runs-on || '"zli-kubecamp-no-docker"') }}
    permissions:
      contents: read
      pull-requests: read
      # Unchanged PR components are aliased to the main commit that latest points to.
      packages: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sha: ${{ steps.plan.outputs.sha }}
      tags: ${{ steps.plan.outputs.tags }}
      aliases: ${{ steps.plan.outputs.aliases }}
      pr: ${{ steps.plan.outputs.pr }}
      has_images: ${{ steps.plan.outputs.has_images }}
      enabled: ${{ steps.plan.outputs.enabled }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test image planning and retention
        run: node .github/scripts/images.test.mjs
      - name: Test runner selection
        run: node .github/scripts/select-runner.test.mjs
      - id: plan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const {default: plan} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/image-plan.mjs`);
            await plan({github, context, core});
  build:
    needs: [runner, plan]
    if: needs.plan.outputs.enabled == 'true' && needs.plan.outputs.has_images == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(needs.runner.outputs.docker-runs-on || '"zli-k8s"') }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Immutable tags are never rewritten; a rerun for the same commit reuses what was already published.
      - name: Check existing immutable tags
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/zli-uoa/zoo2-${{ matrix.component }}
          TAG: ${{ fromJSON(needs.plan.outputs.tags)[matrix.component] }}
          PREVIEW_TAG: ${{ matrix.component == 'frontend' && github.event_name != 'pull_request' && format('preview-{0}', needs.plan.outputs.sha) || '' }}
        run: |
          # A missing tag reports "not found"; a package that does not exist yet may be refused instead.
          exists() {
            local out
            if out=$(docker buildx imagetools inspect "$1" 2>&1); then echo true
            elif grep -qi 'not found' <<<"$out"; then echo false
            elif gh api "orgs/Zli-UoA/packages/container/${IMAGE##*/}" --silent 2>&1 | grep -q 'HTTP 404'; then echo false
            else echo "$out" >&2; return 1
            fi
          }
          image=$(exists "$IMAGE:$TAG")
          preview=false
          if [ -n "$PREVIEW_TAG" ]; then preview=$(exists "$IMAGE:$PREVIEW_TAG"); fi
          [ "$image" = false ] || echo "::notice::$IMAGE:$TAG already exists; not rebuilding"
          [ "$preview" = false ] || echo "::notice::$IMAGE:$PREVIEW_TAG already exists; not rebuilding"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "preview=$preview" >> "$GITHUB_OUTPUT"
      - name: Validate production OIDC configuration
        if: matrix.component == 'frontend' && github.event_name != 'pull_request' && steps.existing.outputs.image == 'false'
        env:
          ISSUER: ${{ vars.VITE_OIDC_ISSUER }}
          CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}
        run: |
          test -n "${ISSUER//[[:space:]]/}" || { echo 'Set VITE_OIDC_ISSUER repository variable'; exit 1; }
          test -n "${CLIENT_ID//[[:space:]]/}" || { echo 'Set VITE_OIDC_CLIENT_ID repository variable'; exit 1; }
      # Save once per dependency set; a per-commit key would evict the buildx layer caches.
      - name: Restore Rust cache mounts
        id: rust-cache
        if: matrix.component == 'backend' && steps.existing.outputs.image == 'false'
        uses: actions/cache@v6
        with:
          path: .buildkit-cache
          key: rust-image-${{ runner.os }}-${{ hashFiles('infra/Dockerfile-backend-deploy') }}-${{ hashFiles('backend/Cargo.lock') }}
          # Reuse dependency builds only within the same compiler/base image. Native artifacts
          # (for example vendored OpenSSL) may require a newer glibc than the next build image.
          restore-keys: |
            rust-image-${{ runner.os }}-${{ hashFiles('infra/Dockerfile-backend-deploy') }}-
      - name: Inject Rust cache mounts
        if: matrix.component == 'backend' && steps.existing.outputs.image == 'false'
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          skip-extraction: ${{ steps.rust-cache.outputs.cache-hit }}
          cache-map: |
            {
              ".buildkit-cache/registry": "/usr/local/cargo/registry",
              ".buildkit-cache/git": "/usr/local/cargo/git",
              ".buildkit-cache/target": "/app/target"
            }
      # PR images are pushed by digest only. The preview ResourceSet pulls pr-<number>-<SHA> as soon as
      # it exists, so the publish job tags all components after every build, migrate last.
      - name: Build and publish immutable image
        id: image
        if: steps.existing.outputs.image == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile-${{ matrix.component }}-deploy
          push: ${{ github.event_name != 'pull_request' }}
          outputs: ${{ github.event_name == 'pull_request' && format('type=image,name=ghcr.io/zli-uoa/zoo2-{0},push-by-digest=true,name-canonical=true,push=true', matrix.component) || '' }}
          platforms: linux/amd64
          tags: ${{ github.event_name != 'pull_request' && format('ghcr.io/zli-uoa/zoo2-{0}:{1}', matrix.component, fromJSON(needs.plan.outputs.tags)[matrix.component]) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/Zli-UoA/zoo2
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          build-args: |
            VITE_API_BASE_URL=
            VITE_PREVIEW_AUTH=${{ github.event_name == 'pull_request' && 'true' || 'false' }}
            VITE_OIDC_ISSUER=${{ github.event_name != 'pull_request' && vars.VITE_OIDC_ISSUER || '' }}
            VITE_OIDC_CLIENT_ID=${{ github.event_name != 'pull_request' && vars.VITE_OIDC_CLIENT_ID || '' }}
            VITE_OIDC_REDIRECT_URI=${{ github.event_name != 'pull_request' && vars.VITE_OIDC_REDIRECT_URI || '' }}
            VITE_OIDC_SCOPE=${{ github.event_name != 'pull_request' && vars.VITE_OIDC_SCOPE || '' }}
            VITE_OIDC_RESOURCE=${{ github.event_name != 'pull_request' && vars.VITE_OIDC_RESOURCE || '' }}
            VITE_OIDC_POST_LOGOUT_REDIRECT_URI=${{ github.event_name != 'pull_request' && vars.VITE_OIDC_POST_LOGOUT_REDIRECT_URI || '' }}
      - name: Record PR image digest
        if: github.event_name == 'pull_request' && steps.image.outcome == 'success'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Unexpected digest: $DIGEST"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s' "$DIGEST" > "$RUNNER_TEMP/digests/$COMPONENT"
      - name: Upload PR image digest
        if: github.event_name == 'pull_request' && steps.image.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.component }}
          path: ${{ runner.temp }}/digests/${{ matrix.component }}
          retention-days: 1
          if-no-files-found: error
      - name: Build and publish shared preview frontend
        if: steps.existing.outputs.preview == 'false' && matrix.component == 'frontend' && github.event_name != 'pull_request'
        id: preview
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile-frontend-deploy
          push: true
          platforms: linux/amd64
          tags: ghcr.io/zli-uoa/zoo2-frontend:preview-${{ needs.plan.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Zli-UoA/zoo2
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
          cache-from: type=gha,scope=frontend-preview
          cache-to: type=gha,mode=max,scope=frontend-preview
          build-args: |
            VITE_API_BASE_URL=
            VITE_PREVIEW_AUTH=true
            VITE_OIDC_ISSUER=
            VITE_OIDC_CLIENT_ID=
            VITE_OIDC_REDIRECT_URI=
            VITE_OIDC_SCOPE=
            VITE_OIDC_RESOURCE=
            VITE_OIDC_POST_LOGOUT_REDIRECT_URI=
  # Promote all components together, only after every build succeeded, so aliases never mix commits.
  # The shared release tag goes on last, migrate last of all: zoo2-infra's ResourceSet deploys all three
  # images at the newest release tag it sees on migrate, so the other two must already carry it.
  promote:
    needs: [runner, plan, build]
    if: github.event_name != 'pull_request'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(needs.runner.outputs.runs-on || '"zli-kubecamp-no-docker"') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      # Registry-only imagetools uses the bundled CLI; no builder or daemon.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote current main images
        uses: actions/github-script@v9
        env:
          IMAGE_SHA: ${{ needs.plan.outputs.sha }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          RELEASE: ${{ needs.plan.outputs.release }}
        with:
          script: |
            const {promotionAliases} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/image-plan.mjs`);
            const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            const sha = process.env.IMAGE_SHA;
            if (data.commit.sha !== sha) {
              core.notice('Newer main exists; keeping immutable tags without promoting aliases');
              return;
            }
            const selected = JSON.parse(process.env.MATRIX).include.map(({component}) => component);
            const aliases = promotionAliases(selected, sha, process.env.RELEASE);
            // Tags cannot move atomically across packages; roll back on failure so aliases do not stay mixed.
            // Only a missing alias (first promotion, or a new release tag) may lack a previous digest; any
            // other failure stops before promoting. A release tag left on frontend or backend by a failed
            // run is never deployed, because migrate, tagged last, does not carry it.
            const previous = [];
            for (const [image, alias] of aliases) {
              const {exitCode, stdout, stderr} = await exec.getExecOutput('docker', ['buildx', 'imagetools', 'inspect', `${image}:${alias}`, '--format', '{{json .Manifest}}'], {ignoreReturnCode: true, silent: true});
              if (exitCode === 0) previous.push(JSON.parse(stdout).digest);
              else if (/not found/i.test(stderr)) previous.push(null);
              else throw new Error(`Cannot inspect ${image}:${alias} before promotion: ${stderr.trim()}`);
            }
            let done = 0;
            try {
              for (const [image, alias, source] of aliases) {
                await exec.exec('docker', ['buildx', 'imagetools', 'create', '-t', `${image}:${alias}`, `${image}:${source}`]);
                done++;
              }
            } catch (error) {
              // Attempt every restore, then report the promotion failure together with any restore failures.
              const failed = [];
              for (let i = done - 1; i >= 0; i--) {
                const [image, alias] = aliases[i];
                if (!previous[i]) { core.warning(`${image}:${alias} did not exist before promotion; left on the new commit`); continue; }
                try {
                  await exec.exec('docker', ['buildx', 'imagetools', 'create', '-t', `${image}:${alias}`, `${image}@${previous[i]}`]);
                } catch (restoreError) {
                  failed.push(`${image}:${alias} (${restoreError.message})`);
                }
              }
              if (failed.length) core.error(`Rollback failed; aliases are mixed: ${failed.join(', ')}`);
              throw error;
            }
  # Give every PR component the same pr-<number>-<SHA> tag, which the site1 preview ResourceSet pulls.
  # Tags appear only after every build succeeded, and migrate last: the ResourceSet runs the migration as
  # soon as its tag exists, so a failed build must not leave a migrated schema behind an old app.
  # Built components are tagged from the digests the build pushed; unchanged ones alias the pinned main image.
  publish:
    needs: [runner, plan, build]
    if: >-
      always() && github.event_name == 'pull_request' && needs.plan.result == 'success' &&
      needs.plan.outputs.enabled == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(needs.runner.outputs.runs-on || '"zli-kubecamp-no-docker"') }}
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Download PR image digests
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      # Registry-only imagetools uses the bundled CLI; no builder or daemon.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag PR images, migrate last
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.plan.outputs.pr }}
          IMAGE_SHA: ${{ needs.plan.outputs.sha }}
          TAGS: ${{ needs.plan.outputs.tags }}
          ALIASES: ${{ needs.plan.outputs.aliases }}
        with:
          script: |
            const {existsSync, readFileSync} = await import('node:fs');
            // A closed or updated PR is no longer deployed; its newer run publishes the current head.
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.PR_NUMBER)});
            if (pr.state !== 'open' || pr.head.sha !== process.env.IMAGE_SHA) {
              core.notice('PR closed or changed; not tagging');
              return;
            }
            const tags = JSON.parse(process.env.TAGS);
            const aliases = Object.fromEntries(JSON.parse(process.env.ALIASES).map(({component, source}) => [component, source]));
            for (const component of ['frontend', 'backend', 'migrate']) {
              const image = `ghcr.io/zli-uoa/zoo2-${component}`;
              const target = `${image}:${tags[component]}`;
              // Immutable tags are never rewritten; a rerun keeps what was already published.
              const {exitCode, stderr} = await exec.getExecOutput('docker', ['buildx', 'imagetools', 'inspect', target], {ignoreReturnCode: true, silent: true});
              if (exitCode === 0) { core.notice(`${target} already exists; not tagging`); continue; }
              if (!/not found/i.test(stderr)) throw new Error(`Cannot inspect ${target}: ${stderr.trim()}`);
              const digestFile = `${process.env.RUNNER_TEMP}/digests/${component}`;
              let source;
              if (component in aliases) source = `${image}:${aliases[component]}`;
              else if (existsSync(digestFile)) source = `${image}@${readFileSync(digestFile, 'utf8').trim()}`;
              else throw new Error(`${component} was planned for a build but has no digest or tag`);
              if (!/@sha256:[a-f0-9]{64}$|:[a-z0-9-]+$/.test(source)) throw new Error(`Unexpected source ${source}`);
              await exec.exec('docker', ['buildx', 'imagetools', 'create', '-t', target, source]);
            }
