name: CI
on:
  push:
    paths:
      - "backend/**"
      - "infra/db/**"
      - "infra/Dockerfile-backend-deploy*"
      - "infra/Dockerfile-migrate-deploy*"
      - "infra/compose.stg*.yaml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-backend.yaml"
      - ".github/workflows/select-runner.yaml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# runner ジョブが zli-k8s（self-hosted）か GitHub-hosted を選ぶ（select-runner.yaml）。
jobs:
  runner:
    uses: ./.github/workflows/select-runner.yaml
    secrets:
      runner-status-token: ${{ secrets.RUNNER_STATUS_TOKEN }}

  build:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Checkout
        uses: actions/checkout@v7
      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build project
        run: |
          cargo build

  lint:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: lint check
        run: |
          cargo clippy
      - name: format check
        run: |
          cargo fmt --check

  unit-test:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: unit test
        run: |
          cargo test --lib

  deploy-image:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: deploy-image-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build production backend image
        run: docker compose --project-directory . -f infra/compose.stg.yaml build backend

      # compose の backend サービスは ENVIRONMENT=production なので、
      # OIDC 未設定・空文字のままでは起動しないことを確認する。
      - name: Reject production startup without OIDC configuration
        run: |
          set +e
          output=$(docker compose --project-directory . -f infra/compose.stg.yaml run -T --rm --no-deps backend 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -ne 0
          grep -q "OIDC configuration" <<<"$output"

      - name: Reject production startup with empty OIDC configuration
        env:
          OIDC_ISSUER: ""
          OIDC_AUDIENCE: ""
          OIDC_CLIENT_ID: ""
          OIDC_JWKS_URL: ""
        run: |
          set +e
          output=$(docker compose --project-directory . -f infra/compose.stg.yaml run -T --rm --no-deps backend 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -ne 0
          grep -q "OIDC configuration" <<<"$output"

      - name: Start production backend with OIDC configuration
        env:
          OIDC_ISSUER: https://id.example
          OIDC_AUDIENCE: zoo
          OIDC_JWKS_URL: https://id.example/jwks
        run: |
          compose=(docker compose --project-directory . -f infra/compose.stg.yaml)
          "${compose[@]}" build migrate
          "${compose[@]}" up -d --wait postgres
          "${compose[@]}" run -T --rm migrate
          "${compose[@]}" up -d --wait electric
          "${compose[@]}" up -d backend

          backend_id=$("${compose[@]}" ps -q backend)
          for _ in $(seq 1 60); do
            if docker logs "$backend_id" 2>&1 | grep -q "Server listening"; then
              env_dump=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$backend_id")
              grep -qx "OIDC_ISSUER=https://id.example" <<<"$env_dump"
              grep -qx "OIDC_AUDIENCE=zoo" <<<"$env_dump"
              grep -qx "OIDC_JWKS_URL=https://id.example/jwks" <<<"$env_dump"
              docker run --rm --network "container:$backend_id" curlimages/curl:8.10.1 \
                -fsS http://127.0.0.1:8000/health
              exit 0
            fi
            sleep 1
          done
          "${compose[@]}" logs backend
          exit 1

      - name: Show container logs
        if: failure()
        run: docker compose --project-directory . -f infra/compose.stg.yaml logs backend postgres migrate electric

      - name: Stop containers
        if: always()
        run: docker compose --project-directory . -f infra/compose.stg.yaml down -v --remove-orphans

  e2e:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Start PostgreSQL and Electric
        working-directory: .
        run: docker compose -f infra/db/compose.yml up -d --wait

      - name: Setup Atlas
        uses: ariga/setup-atlas@v0

      - name: Apply migrations
        working-directory: ./infra
        env:
          DATABASE_URL: postgres://root:password@localhost:5432/zoo?sslmode=disable
        run: atlas migrate apply --config file://db/atlas.hcl --env local

      - name: e2e test
        env:
          DATABASE_URL: postgres://root:password@localhost:5432/zoo?sslmode=disable
          ELECTRIC_URL: http://localhost:3000
          DEV_AUTH_ENABLED: "true"
        run: |
          cargo test --test '*'

      - name: Show container logs
        if: failure()
        working-directory: .
        run: docker compose -f infra/db/compose.yml logs

      - name: Stop containers
        if: always()
        working-directory: .
        run: docker compose -f infra/db/compose.yml down -v

