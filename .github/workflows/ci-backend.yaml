name: CI Backend
on:
  # merge-queue.yaml がマージキューで呼び出す。
  workflow_call:
    inputs:
      test-plan:
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "crates/zoo-crypto/**"
      - "crates/zoo-components/**"
      - "docs/slack-event-coverage.json"
      - "frontend/src/lib/emoji/emoji-kitchen.json"
      - "infra/db/**"
      - "!infra/db/erd.sh"
      - "!infra/db/compare-*.py"
      - "!infra/db/test-*.py"
      - "infra/Dockerfile-backend-deploy*"
      - "infra/Dockerfile-migrate-deploy*"
      - "infra/compose.stack*.yaml"
      - "rust-toolchain.toml"
      - ".github/scripts/*test-selection*.mjs"
      - ".github/scripts/backend-e2e-selection.mjs"
      - ".github/scripts/rust-test-selection/**"
      - ".github/workflows/select-tests.yaml"
      - ".github/workflows/ci-backend.yaml"
      - ".github/workflows/select-runner.yaml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # PR と merge queue は新しい実行で古いものを止める。main は実行中のものを止めない（待機中の古いものは最新に置き換わる）。
  # 止めると、成功したジョブの最後に保存する Rust などのキャッシュが main に残らず、PR が cold build になる。
  group: ci-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# runner ジョブがDocker不要用とDocker必須用の実行先を選びます。
jobs:
  test-selection:
    if: inputs.test-plan == ''
    uses: ./.github/workflows/select-tests.yaml
    with:
      workflow: ci-backend

  runner:
    uses: ./.github/workflows/select-runner.yaml
    with:
      large: true
    secrets:
      runner-status-token: ${{ secrets.RUNNER_STATUS_TOKEN }}

  # fmt, clippy and unit tests share one job so the Rust cache is
  # restored once across the Rust checks.
  # The binary itself is built and linked by e2e (integration tests) and deploy-image (release),
  # so a separate `cargo build` here would only recompile what clippy already checked.
  check:
    if: >-
      !cancelled() && needs.runner.result == 'success' &&
      (inputs.test-plan != '' || needs.test-selection.result == 'success') &&
      (fromJSON(inputs.test-plan || needs.test-selection.outputs.plan || '{}').backend.check)
    needs: [runner, test-selection]
    # Rust builds and linking can exceed kubecamp's 2GiB budget and starve the runner.
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.large-runs-on || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read Rust toolchain
        id: rust-toolchain
        working-directory: .
        # Install only the toolchain pinned in rust-toolchain.toml, not stable as well.
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: clippy, rustfmt
      - name: Restore Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # キャッシュの保存は main だけにする。PR ごとに数百 MB ずつ保存すると、容量の上限（10GB）を超えて、main のキャッシュも追い出される。
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: backend
          # Not shared with oidc-e2e (backend-debug): cache keys are immutable, and
          # its build-only save would keep clippy and test artifacts out of this one.
          shared-key: backend-check
      - name: Rust test selector regression tests
        if: fromJSON(inputs.test-plan || needs.test-selection.outputs.plan || '{}').backend.verifyCaseSelector
        run: cargo test --locked --manifest-path ../.github/scripts/rust-test-selection/Cargo.toml
      - name: format check
        run: cargo fmt --check
      - name: lint check
        if: fromJSON(inputs.test-plan || needs.test-selection.outputs.plan || '{}').backend.full || fromJSON(inputs.test-plan || needs.test-selection.outputs.plan || '{}').backend.source
        run: cargo clippy
      - name: unit test
        if: fromJSON(inputs.test-plan || needs.test-selection.outputs.plan || '{}').backend.full || fromJSON(inputs.test-plan || needs.test-selection.outputs.plan || '{}').backend.source
        run: cargo test --lib

  deploy-image:
    if: >-
      !cancelled() && needs.runner.result == 'success' &&
      (inputs.test-plan != '' || needs.test-selection.result == 'success') &&
      (github.event_name != 'pull_request' && fromJSON(inputs.test-plan || needs.test-selection.outputs.plan || '{}').backend.deploy)
    needs: [runner, test-selection]
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.docker-runs-on || '"ubuntu-latest"') }}
    # A cold build also needs time to extract and save the cache mounts.
    timeout-minutes: 60
    env:
      POSTGRES_PASSWORD: deploy-image-test
      COMPOSE_PROJECT_NAME: zoo-ci-image-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: default-load=true

      # 保存するのは main だけにする（PR で保存すると、キャッシュの容量の上限を超えて、main のキャッシュも追い出される）。
      - name: Restore Rust cache mounts
        id: rust-cache-main
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .buildkit-cache
          key: ci-rust-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/Dockerfile-backend-deploy') }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ci-rust-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/Dockerfile-backend-deploy') }}-
      - name: Restore Rust cache mounts
        id: rust-cache-pr
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .buildkit-cache
          key: ci-rust-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/Dockerfile-backend-deploy') }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ci-rust-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/Dockerfile-backend-deploy') }}-

      - name: Inject Rust cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          # main 以外はキャッシュを保存しないので、ビルド後の取り出し（ホストへのコピー）も省く。
          skip-extraction: ${{ github.ref != 'refs/heads/main' || steps.rust-cache-main.outputs.cache-hit == 'true' }}
          cache-map: |
            {
              ".buildkit-cache/registry": "/usr/local/cargo/registry",
              ".buildkit-cache/git": "/usr/local/cargo/git",
              ".buildkit-cache/target": "/app/target"
            }

      - name: Build production backend image
        run: |
          docker compose --project-directory . -f infra/compose.stack.yaml \
            build --builder "${{ steps.buildx.outputs.name }}" backend

      # compose の backend サービスは ENVIRONMENT=production なので、
      # OIDC 未設定・空文字のままでは起動しないことを確認する。
      - name: Reject production startup without OIDC configuration
        run: |
          set +e
          output=$(docker compose --project-directory . -f infra/compose.stack.yaml run -T --rm --no-deps backend 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -ne 0
          grep -q "OIDC configuration" <<<"$output"

      - name: Reject production startup with empty OIDC configuration
        env:
          OIDC_ISSUER: ""
          OIDC_AUDIENCE: ""
          OIDC_CLIENT_ID: ""
          OIDC_JWKS_URL: ""
        run: |
          set +e
          output=$(docker compose --project-directory . -f infra/compose.stack.yaml run -T --rm --no-deps backend 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -ne 0
          grep -q "OIDC configuration" <<<"$output"

      - name: Reject production startup without S3 configuration
        env:
          OIDC_ISSUER: https://id.example
          OIDC_AUDIENCE: zoo
          OIDC_JWKS_URL: https://id.example/jwks
        run: |
          set +e
          output=$(docker compose --project-directory . -f infra/compose.stack.yaml run -T --rm --no-deps backend 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -ne 0
          grep -q "S3_ENDPOINT must be explicitly set" <<<"$output"

      - name: Start production backend with OIDC configuration
        env:
          OIDC_ISSUER: https://id.example
          OIDC_AUDIENCE: zoo
          OIDC_JWKS_URL: https://id.example/jwks
          S3_ENDPOINT: https://example.r2.cloudflarestorage.com
          S3_BUCKET: zoo-attachments-prod
          S3_ACCESS_KEY_ID: dummy-prod-access-key
          S3_SECRET_ACCESS_KEY: dummy-prod-secret-key
        run: |
          compose=(docker compose --project-directory . -f infra/compose.stack.yaml)
          "${compose[@]}" build migrate
          "${compose[@]}" up -d --wait postgres
          "${compose[@]}" run -T --rm migrate
          "${compose[@]}" up -d --wait electric
          "${compose[@]}" up -d backend

          backend_id=$("${compose[@]}" ps -q backend)
          for _ in $(seq 1 60); do
            if docker logs "$backend_id" 2>&1 | grep -q "Server listening"; then
              env_dump=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$backend_id")
              grep -qx "OIDC_ISSUER=https://id.example" <<<"$env_dump"
              grep -qx "OIDC_AUDIENCE=zoo" <<<"$env_dump"
              grep -qx "OIDC_JWKS_URL=https://id.example/jwks" <<<"$env_dump"
              docker run --rm --network "container:$backend_id" curlimages/curl:8.10.1 \
                -fsS http://127.0.0.1:8000/health
              exit 0
            fi
            sleep 1
          done
          "${compose[@]}" logs backend
          exit 1

      - name: Show container logs
        if: failure()
        run: docker compose --project-directory . -f infra/compose.stack.yaml logs backend postgres migrate electric

      - name: Stop containers
        if: always()
        run: docker compose --project-directory . -f infra/compose.stack.yaml down -v --remove-orphans

  e2e:
    name: e2e (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        # テストバイナリーは 1 つの DB を共有し、プロセス内の Mutex で共有行を守っているので、
        # バイナリー同士は並列に動かせない。そこで、DB ごと分けた 2 つの job に振り分ける。
        # backend-e2e-selection.mjs と同じ区分で、選ばれたテストがある側だけ実行する。
        leg: ${{ fromJSON(inputs.test-plan || needs.test-selection.outputs.plan || '{}').backend.legs }}
    env:
      COMPOSE_PROJECT_NAME: zoo-ci-backend-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PORT: "0"
      ELECTRIC_PORT: "0"
      S3_PORT: "0"
      S3_CONSOLE_PORT: "0"
      ACTIVITYPUB_BASE_URL: https://zoo.example.com
      # 34 個のテストバイナリーをそれぞれリンクするので、デバッグ情報を行番号だけにしてリンクを軽くする。
      # panic のバックトレースの行番号は残る。
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    if: >-
      !cancelled() && needs.runner.result == 'success' &&
      (inputs.test-plan != '' || needs.test-selection.result == 'success') &&
      (fromJSON(inputs.test-plan || needs.test-selection.outputs.plan || '{}').backend.run && (github.event_name != 'pull_request' || !fromJSON(inputs.test-plan || needs.test-selection.outputs.plan || '{}').backend.full))
    needs: [runner, test-selection]
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.docker-runs-on || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Read Rust toolchain
        id: rust-toolchain
        working-directory: .
        # Install only the toolchain pinned in rust-toolchain.toml, not stable as well.
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Restore Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # キャッシュの保存は main だけにする。PR ごとに数百 MB ずつ保存すると、容量の上限（10GB）を超えて、main のキャッシュも追い出される。
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: backend

      - name: Start PostgreSQL, Electric, and RustFS
        working-directory: .
        run: |
          docker compose -f infra/db/compose.yml up -d --wait
          postgres_port=$(docker compose -f infra/db/compose.yml port postgres 5432)
          electric_port=$(docker compose -f infra/db/compose.yml port electric 3000)
          rustfs_port=$(docker compose -f infra/db/compose.yml port rustfs 9000)
          echo "DATABASE_URL=postgres://root:password@${postgres_port}/zoo?sslmode=disable" >> "$GITHUB_ENV"
          echo "ELECTRIC_URL=http://${electric_port}" >> "$GITHUB_ENV"
          echo "S3_ENDPOINT=http://${rustfs_port}" >> "$GITHUB_ENV"

      - name: Setup Atlas
        uses: ariga/setup-atlas@28f0b75814c08b1a265b75713c120cfad46433ae # v0

      - name: Validate migrations and upgrade path from base branch
        working-directory: .
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.merge_group.base_ref || '' }}
        run: |
          psql_exec() {
            docker compose -f infra/db/compose.yml exec -T postgres psql -q -X -v ON_ERROR_STOP=1 -U root "$@"
          }
          for db in from_migrations from_schema; do
            psql_exec -d postgres -c "DROP DATABASE IF EXISTS $db" -c "CREATE DATABASE $db"
          done

          # `migrate validate --dev-url` replays statements without preserving
          # the per-file transaction required by `-- atlas:txmode file` (for
          # example, LOCK TABLE ... NOWAIT). Validate checksums here; the
          # PostgreSQL replay below validates SQL with each file's txmode.
          atlas migrate validate --dir file://infra/db/migrations

          # atlas schema diff は未ログインだと関数を含む schema.sql を読めないため、
          # マイグレーションと schema.sql をそれぞれ空のDBに適用し、pg_dump の結果を比較します。
          # `-- atlas:txmode none` のファイル（CREATE INDEX CONCURRENTLY など）は、Atlas と同じく
          # トランザクションの外で実行します。それ以外は 1 ファイル 1 トランザクションです。
          for f in infra/db/migrations/*.sql; do
            if grep -q '^-- atlas:txmode none' "$f"; then
              psql_exec -d from_migrations < "$f" > /dev/null
            else
              psql_exec -d from_migrations -1 < "$f" > /dev/null
            fi
          done
          psql_exec -d from_schema -1 < infra/db/schema.sql > /dev/null

          # schema.sql で表現しないカラム順、REPLICA IDENTITY と空行は比較から除外します。
          dump_schema() {
            docker compose -f infra/db/compose.yml exec -T postgres \
              pg_dump -U root --schema-only --no-owner --no-privileges "$1" |
              grep -v -e '^$' -e '^\\restrict ' -e '^\\unrestrict ' -e 'REPLICA IDENTITY' |
              awk '
                /^CREATE TABLE / { print; in_table = 1; next }
                in_table && /^\);/ { close("sort"); in_table = 0 }
                in_table { sub(/,$/, ""); print | "sort"; next }
                { print }
              '
          }
          schema_diff=$(diff -u <(dump_schema from_migrations) <(dump_schema from_schema)) || true
          for db in from_migrations from_schema; do
            psql_exec -d postgres -c "DROP DATABASE $db"
          done
          if [ -n "$schema_diff" ]; then
            echo "::error::infra/db/schema.sql is out of sync with infra/db/migrations:" >&2
            printf '%s\n' "$schema_diff" >&2
            exit 1
          fi

          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            base_dir=$(mktemp -d)
            git archive "FETCH_HEAD:infra/db/migrations" | tar -x -C "$base_dir"
            atlas migrate apply --dir "file://$base_dir" --url "$DATABASE_URL"
            rm -rf "$base_dir"
          fi

      - name: Apply migrations
        working-directory: ./infra
        run: atlas migrate apply --config file://db/atlas.hcl --env local

      - name: e2e test
        env:
          DEV_AUTH_ENABLED: "true"
          LEG: ${{ matrix.leg }}
          TEST_SELECTION: ${{ toJSON(fromJSON(inputs.test-plan || needs.test-selection.outputs.plan || '{}').backend) }}
        run: node ../.github/scripts/backend-e2e-selection.mjs

      - name: Show container logs
        if: failure()
        working-directory: .
        run: docker compose -f infra/db/compose.yml logs

      - name: Stop containers
        if: always()
        working-directory: .
        run: docker compose -f infra/db/compose.yml down -v


  shared-emoji-projection:
    if: >-
      !cancelled() && needs.runner.result == 'success' &&
      (inputs.test-plan != '' || needs.test-selection.result == 'success') &&
      (fromJSON(inputs.test-plan || needs.test-selection.outputs.plan || '{}').backend.emoji && (github.event_name != 'pull_request' || !fromJSON(inputs.test-plan || needs.test-selection.outputs.plan || '{}').backend.full))
    needs: [runner, test-selection]
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.docker-runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 45
    env:
      EMOJI_TEST_DATABASE_URL: postgres://root:emoji-local-test@127.0.0.1:5432/emoji_projection_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # キャッシュの保存は main だけにする。PR ごとに数百 MB ずつ保存すると、容量の上限（10GB）を超えて、main のキャッシュも追い出される。
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: backend
          shared-key: backend-check
      # schema.sql は pg_bigm を使う。service コンテナではイメージをビルドできないので、ここで立てる。
      - name: Start PostgreSQL with pg_bigm
        run: |
          docker build -t zoo2-postgres-bigm:16 infra/db/postgres
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_USER=root \
            -e POSTGRES_PASSWORD=emoji-local-test -e POSTGRES_DB=emoji_projection_test zoo2-postgres-bigm:16
          for _ in $(seq 60); do
            docker exec postgres pg_isready -U root -d emoji_projection_test -h 127.0.0.1 && exit 0
            sleep 2
          done
          docker logs postgres
          exit 1
      - name: Apply disposable database schema
        run: psql "$EMOJI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/db/schema.sql
      - name: Check shared emoji display projection
        working-directory: backend
        run: cargo test --test emoji_service_test --locked -- --include-ignored
