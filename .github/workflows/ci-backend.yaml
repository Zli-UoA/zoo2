name: CI
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/db/**"
      - "infra/Dockerfile-backend-deploy*"
      - "infra/Dockerfile-migrate-deploy*"
      - "infra/compose.stg*.yaml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-backend.yaml"
      - ".github/workflows/select-runner.yaml"
  pull_request:
    paths:
      - "backend/**"
      - "infra/db/**"
      - "infra/Dockerfile-backend-deploy*"
      - "infra/Dockerfile-migrate-deploy*"
      - "infra/compose.stg*.yaml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-backend.yaml"
      - ".github/workflows/select-runner.yaml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# runner ジョブが zli-k8s（self-hosted）か GitHub-hosted を選ぶ（select-runner.yaml）。
jobs:
  runner:
    uses: ./.github/workflows/select-runner.yaml
    secrets:
      runner-status-token: ${{ secrets.RUNNER_STATUS_TOKEN }}

  build:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Rust toolchain
        id: rust-toolchain
        working-directory: .
        # Install only the toolchain pinned in rust-toolchain.toml, not stable as well.
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          # Shared with oidc-e2e in ci-frontend-auth-e2e.yaml, which runs the same
          # debug build.
          shared-key: backend-debug
      - name: Build project
        run: |
          cargo build

  lint:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Rust toolchain
        id: rust-toolchain
        working-directory: .
        # Install only the toolchain pinned in rust-toolchain.toml, not stable as well.
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: clippy, rustfmt

      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: lint check
        run: |
          cargo clippy
      - name: format check
        run: |
          cargo fmt --check

  unit-test:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Rust toolchain
        id: rust-toolchain
        working-directory: .
        # Install only the toolchain pinned in rust-toolchain.toml, not stable as well.
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: unit test
        run: |
          cargo test --lib

  deploy-image:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    # A cold build also needs time to extract and save the cache mounts.
    timeout-minutes: 60
    env:
      POSTGRES_PASSWORD: deploy-image-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: default-load=true

      - name: Restore Rust cache mounts
        id: rust-cache
        uses: actions/cache@v6
        with:
          path: .buildkit-cache
          key: ci-rust-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/Dockerfile-backend-deploy') }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ci-rust-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/Dockerfile-backend-deploy') }}-

      - name: Inject Rust cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          skip-extraction: ${{ steps.rust-cache.outputs.cache-hit }}
          cache-map: |
            {
              ".buildkit-cache/registry": "/usr/local/cargo/registry",
              ".buildkit-cache/git": "/usr/local/cargo/git",
              ".buildkit-cache/target": "/app/target"
            }

      - name: Build production backend image
        run: |
          docker compose --project-directory . -f infra/compose.stg.yaml \
            build --builder "${{ steps.buildx.outputs.name }}" backend

      # compose の backend サービスは ENVIRONMENT=production なので、
      # OIDC 未設定・空文字のままでは起動しないことを確認する。
      - name: Reject production startup without OIDC configuration
        run: |
          set +e
          output=$(docker compose --project-directory . -f infra/compose.stg.yaml run -T --rm --no-deps backend 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -ne 0
          grep -q "OIDC configuration" <<<"$output"

      - name: Reject production startup with empty OIDC configuration
        env:
          OIDC_ISSUER: ""
          OIDC_AUDIENCE: ""
          OIDC_CLIENT_ID: ""
          OIDC_JWKS_URL: ""
        run: |
          set +e
          output=$(docker compose --project-directory . -f infra/compose.stg.yaml run -T --rm --no-deps backend 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -ne 0
          grep -q "OIDC configuration" <<<"$output"

      - name: Start production backend with OIDC configuration
        env:
          OIDC_ISSUER: https://id.example
          OIDC_AUDIENCE: zoo
          OIDC_JWKS_URL: https://id.example/jwks
        run: |
          compose=(docker compose --project-directory . -f infra/compose.stg.yaml)
          "${compose[@]}" build migrate
          "${compose[@]}" up -d --wait postgres
          "${compose[@]}" run -T --rm migrate
          "${compose[@]}" up -d --wait electric
          "${compose[@]}" up -d backend

          backend_id=$("${compose[@]}" ps -q backend)
          for _ in $(seq 1 60); do
            if docker logs "$backend_id" 2>&1 | grep -q "Server listening"; then
              env_dump=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$backend_id")
              grep -qx "OIDC_ISSUER=https://id.example" <<<"$env_dump"
              grep -qx "OIDC_AUDIENCE=zoo" <<<"$env_dump"
              grep -qx "OIDC_JWKS_URL=https://id.example/jwks" <<<"$env_dump"
              docker run --rm --network "container:$backend_id" curlimages/curl:8.10.1 \
                -fsS http://127.0.0.1:8000/health
              exit 0
            fi
            sleep 1
          done
          "${compose[@]}" logs backend
          exit 1

      - name: Show container logs
        if: failure()
        run: docker compose --project-directory . -f infra/compose.stg.yaml logs backend postgres migrate electric

      - name: Stop containers
        if: always()
        run: docker compose --project-directory . -f infra/compose.stg.yaml down -v --remove-orphans

  e2e:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Rust toolchain
        id: rust-toolchain
        working-directory: .
        # Install only the toolchain pinned in rust-toolchain.toml, not stable as well.
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Start PostgreSQL and Electric
        working-directory: .
        run: docker compose -f infra/db/compose.yml up -d --wait

      - name: Setup Atlas
        uses: ariga/setup-atlas@v0

      - name: Validate migrations and upgrade path from base branch
        working-directory: .
        env:
          DATABASE_URL: postgres://root:password@localhost:5432/zoo?sslmode=disable
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        run: |
          docker compose -f infra/db/compose.yml exec -T postgres \
            psql -U root -d postgres -c "CREATE DATABASE atlas_dev;"
          atlas migrate validate --dir file://infra/db/migrations \
            --dev-url "postgres://root:password@localhost:5432/atlas_dev?search_path=public&sslmode=disable"
          schema_diff=$(atlas schema diff \
            --from file://infra/db/migrations \
            --to file://infra/db/schema.sql \
            --dev-url "postgres://root:password@localhost:5432/atlas_dev?search_path=public&sslmode=disable")
          real_diff=$(printf '%s\n' "$schema_diff" | grep -v 'RENAME CONSTRAINT.*_pkey' | grep -v '^\s*--' | grep -v '^\s*$' || true)
          if [ -n "$real_diff" ]; then
            echo "::error::infra/db/schema.sql is out of sync with infra/db/migrations:" >&2
            printf '%s\n' "$schema_diff" >&2
            exit 1
          fi
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            base_dir=$(mktemp -d)
            git archive "FETCH_HEAD:infra/db/migrations" | tar -x -C "$base_dir"
            atlas migrate apply --dir "file://$base_dir" --url "$DATABASE_URL"
            rm -rf "$base_dir"
          fi

      - name: Apply migrations
        working-directory: ./infra
        env:
          DATABASE_URL: postgres://root:password@localhost:5432/zoo?sslmode=disable
        run: atlas migrate apply --config file://db/atlas.hcl --env local

      - name: e2e test
        env:
          DATABASE_URL: postgres://root:password@localhost:5432/zoo?sslmode=disable
          ELECTRIC_URL: http://localhost:3000
          DEV_AUTH_ENABLED: "true"
        run: |
          cargo test --test '*'

      - name: Show container logs
        if: failure()
        working-directory: .
        run: docker compose -f infra/db/compose.yml logs

      - name: Stop containers
        if: always()
        working-directory: .
        run: docker compose -f infra/db/compose.yml down -v

