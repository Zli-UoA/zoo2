name: CI
on:
  push:
    paths:
      - "backend/**"
      - "infra/db/migrations/**"
      - "infra/db/compose.yml"
      - "infra/db/compose.base.yml"
      - ".github/workflows/ci-backend.yaml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Checkout
        uses: actions/checkout@v7
      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build project
        run: |
          cargo build

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: lint check
        run: |
          cargo clippy
      - name: format check
        run: |
          cargo fmt --check

  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: unit test
        run: |
          cargo test --lib

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Start PostgreSQL and Electric
        working-directory: .
        run: docker compose -f infra/db/compose.yml up -d --wait

      - name: Setup Atlas
        uses: ariga/setup-atlas@v0

      - name: Apply migrations
        working-directory: ./infra
        env:
          DATABASE_URL: postgres://root:password@localhost:5432/zoo?sslmode=disable
        run: atlas migrate apply --config file://db/atlas.hcl --env local

      - name: e2e test
        env:
          DATABASE_URL: postgres://root:password@localhost:5432/zoo?sslmode=disable
          ELECTRIC_URL: http://localhost:3000
          DEV_AUTH_ENABLED: "true"
        run: |
          cargo test --test '*'

      - name: Show container logs
        if: failure()
        working-directory: .
        run: docker compose -f infra/db/compose.yml logs

      - name: Stop containers
        if: always()
        working-directory: .
        run: docker compose -f infra/db/compose.yml down -v

