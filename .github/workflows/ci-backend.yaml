name: CI
on:
  push:
    paths:
      - "backend/**"
      - "infra/db/migrations/**"
      - "infra/db/compose.yml"
      - ".github/workflows/ci-backend.yaml"
      - ".github/workflows/select-runner.yaml"
  workflow_dispatch:
    inputs:
      runner:
        description: Runner selection (auto prefers a compatible idle self-hosted runner)
        type: choice
        options: [auto, github, self-hosted]
        default: auto
permissions:
  contents: read
jobs:
  select-runner:
    uses: ./.github/workflows/select-runner.yaml
    with:
      mode: ${{ inputs.runner || 'auto' }}
    secrets:
      runner-status-token: ${{ secrets.RUNNER_STATUS_TOKEN }}
  build:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.rust) }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Checkout
        uses: actions/checkout@v7
      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build project
        run: |
          cargo build

  lint:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.rust) }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: lint check
        run: |
          cargo clippy
      - name: format check
        run: |
          cargo fmt --check

  unit-test:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.rust) }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: unit test
        run: |
          cargo test --lib

  e2e:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.docker) }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Start PostgreSQL and Electric
        working-directory: .
        run: docker compose -f infra/db/compose.yml up -d --wait

      - name: Setup Atlas
        uses: ariga/setup-atlas@v0

      - name: Apply migrations
        working-directory: ./infra
        env:
          DATABASE_URL: postgres://root:password@localhost:5432/zoo?sslmode=disable
        run: atlas migrate apply --config file://db/atlas.hcl --env local

      - name: e2e test
        env:
          DATABASE_URL: postgres://root:password@localhost:5432/zoo?sslmode=disable
          ELECTRIC_URL: http://localhost:3000
          DEV_AUTH_ENABLED: "true"
        run: |
          cargo test --test '*'

      - name: Show container logs
        if: failure()
        working-directory: .
        run: docker compose -f infra/db/compose.yml logs

      - name: Stop containers
        if: always()
        working-directory: .
        run: docker compose -f infra/db/compose.yml down -v

