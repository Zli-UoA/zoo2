name: CI
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/slack-event-coverage.json"
      - "infra/db/**"
      - "infra/Dockerfile-backend-deploy*"
      - "infra/Dockerfile-migrate-deploy*"
      - "infra/compose.stg*.yaml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-backend.yaml"
      - ".github/workflows/select-runner.yaml"
  pull_request:
    paths:
      - "backend/**"
      - "docs/slack-event-coverage.json"
      - "infra/db/**"
      - "infra/Dockerfile-backend-deploy*"
      - "infra/Dockerfile-migrate-deploy*"
      - "infra/compose.stg*.yaml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-backend.yaml"
      - ".github/workflows/select-runner.yaml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# runner ジョブがDocker不要用とDocker必須用の実行先を選びます。
jobs:
  runner:
    uses: ./.github/workflows/select-runner.yaml
    secrets:
      runner-status-token: ${{ secrets.RUNNER_STATUS_TOKEN }}

  # fmt, clippy, build and unit tests share one job so the Rust cache is
  # restored once; on kubecamp the restore takes longer than the build itself.
  check:
    needs: runner
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(needs.runner.outputs.runs-on || '"zli-kubecamp-no-docker"') }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Rust toolchain
        id: rust-toolchain
        working-directory: .
        # Install only the toolchain pinned in rust-toolchain.toml, not stable as well.
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: clippy, rustfmt
      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          # Shared with oidc-e2e in ci-frontend-auth-e2e.yaml, which runs the same
          # debug build.
          shared-key: backend-debug
      - name: format check
        run: cargo fmt --check
      - name: lint check
        run: cargo clippy
      - name: Build project
        run: cargo build
      - name: unit test
        run: cargo test --lib

  deploy-image:
    needs: runner
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(needs.runner.outputs.docker-runs-on || '"ubuntu-latest"') }}
    # A cold build also needs time to extract and save the cache mounts.
    timeout-minutes: 60
    env:
      POSTGRES_PASSWORD: deploy-image-test
      COMPOSE_PROJECT_NAME: zoo-ci-image-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: default-load=true

      - name: Restore Rust cache mounts
        id: rust-cache
        uses: actions/cache@v6
        with:
          path: .buildkit-cache
          key: ci-rust-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/Dockerfile-backend-deploy') }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ci-rust-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/Dockerfile-backend-deploy') }}-

      - name: Inject Rust cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          skip-extraction: ${{ steps.rust-cache.outputs.cache-hit }}
          cache-map: |
            {
              ".buildkit-cache/registry": "/usr/local/cargo/registry",
              ".buildkit-cache/git": "/usr/local/cargo/git",
              ".buildkit-cache/target": "/app/target"
            }

      - name: Build production backend image
        run: |
          docker compose --project-directory . -f infra/compose.stg.yaml \
            build --builder "${{ steps.buildx.outputs.name }}" backend

      # compose の backend サービスは ENVIRONMENT=production なので、
      # OIDC 未設定・空文字のままでは起動しないことを確認する。
      - name: Reject production startup without OIDC configuration
        run: |
          set +e
          output=$(docker compose --project-directory . -f infra/compose.stg.yaml run -T --rm --no-deps backend 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -ne 0
          grep -q "OIDC configuration" <<<"$output"

      - name: Reject production startup with empty OIDC configuration
        env:
          OIDC_ISSUER: ""
          OIDC_AUDIENCE: ""
          OIDC_CLIENT_ID: ""
          OIDC_JWKS_URL: ""
        run: |
          set +e
          output=$(docker compose --project-directory . -f infra/compose.stg.yaml run -T --rm --no-deps backend 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -ne 0
          grep -q "OIDC configuration" <<<"$output"

      - name: Reject production startup without S3 configuration
        env:
          OIDC_ISSUER: https://id.example
          OIDC_AUDIENCE: zoo
          OIDC_JWKS_URL: https://id.example/jwks
        run: |
          set +e
          output=$(docker compose --project-directory . -f infra/compose.stg.yaml run -T --rm --no-deps backend 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          test "$rc" -ne 0
          grep -q "S3_ENDPOINT must be explicitly set" <<<"$output"

      - name: Start production backend with OIDC configuration
        env:
          OIDC_ISSUER: https://id.example
          OIDC_AUDIENCE: zoo
          OIDC_JWKS_URL: https://id.example/jwks
          S3_ENDPOINT: https://example.r2.cloudflarestorage.com
          S3_BUCKET: zoo-attachments-prod
          S3_ACCESS_KEY_ID: dummy-prod-access-key
          S3_SECRET_ACCESS_KEY: dummy-prod-secret-key
        run: |
          compose=(docker compose --project-directory . -f infra/compose.stg.yaml)
          "${compose[@]}" build migrate
          "${compose[@]}" up -d --wait postgres
          "${compose[@]}" run -T --rm migrate
          "${compose[@]}" up -d --wait electric
          "${compose[@]}" up -d backend

          backend_id=$("${compose[@]}" ps -q backend)
          for _ in $(seq 1 60); do
            if docker logs "$backend_id" 2>&1 | grep -q "Server listening"; then
              env_dump=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$backend_id")
              grep -qx "OIDC_ISSUER=https://id.example" <<<"$env_dump"
              grep -qx "OIDC_AUDIENCE=zoo" <<<"$env_dump"
              grep -qx "OIDC_JWKS_URL=https://id.example/jwks" <<<"$env_dump"
              docker run --rm --network "container:$backend_id" curlimages/curl:8.10.1 \
                -fsS http://127.0.0.1:8000/health
              exit 0
            fi
            sleep 1
          done
          "${compose[@]}" logs backend
          exit 1

      - name: Show container logs
        if: failure()
        run: docker compose --project-directory . -f infra/compose.stg.yaml logs backend postgres migrate electric

      - name: Stop containers
        if: always()
        run: docker compose --project-directory . -f infra/compose.stg.yaml down -v --remove-orphans

  e2e:
    env:
      COMPOSE_PROJECT_NAME: zoo-ci-backend-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PORT: "0"
      ELECTRIC_PORT: "0"
      S3_PORT: "0"
      S3_CONSOLE_PORT: "0"
    needs: runner
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(needs.runner.outputs.docker-runs-on || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Rust toolchain
        id: rust-toolchain
        working-directory: .
        # Install only the toolchain pinned in rust-toolchain.toml, not stable as well.
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Start PostgreSQL, Electric, and RustFS
        working-directory: .
        run: |
          docker compose -f infra/db/compose.yml up -d --wait
          postgres_port=$(docker compose -f infra/db/compose.yml port postgres 5432)
          electric_port=$(docker compose -f infra/db/compose.yml port electric 3000)
          rustfs_port=$(docker compose -f infra/db/compose.yml port rustfs 9000)
          echo "DATABASE_URL=postgres://root:password@${postgres_port}/zoo?sslmode=disable" >> "$GITHUB_ENV"
          echo "ELECTRIC_URL=http://${electric_port}" >> "$GITHUB_ENV"
          echo "S3_ENDPOINT=http://${rustfs_port}" >> "$GITHUB_ENV"

      - name: Setup Atlas
        uses: ariga/setup-atlas@v0

      - name: Validate migrations and upgrade path from base branch
        working-directory: .
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        run: |
          psql_exec() {
            docker compose -f infra/db/compose.yml exec -T postgres psql -q -X -v ON_ERROR_STOP=1 -U root "$@"
          }
          for db in atlas_dev from_migrations from_schema; do
            psql_exec -d postgres -c "DROP DATABASE IF EXISTS $db" -c "CREATE DATABASE $db"
          done

          atlas migrate validate --dir file://infra/db/migrations \
            --dev-url "${DATABASE_URL%/*}/atlas_dev?search_path=public&sslmode=disable"

          # atlas schema diff は未ログインだと関数を含む schema.sql を読めないため、
          # マイグレーションと schema.sql をそれぞれ空のDBに適用し、pg_dump の結果を比較します。
          for f in infra/db/migrations/*.sql; do
            psql_exec -d from_migrations -1 < "$f" > /dev/null
          done
          psql_exec -d from_schema -1 < infra/db/schema.sql > /dev/null

          # schema.sql で表現しないカラム順、REPLICA IDENTITY と空行は比較から除外します。
          dump_schema() {
            docker compose -f infra/db/compose.yml exec -T postgres \
              pg_dump -U root --schema-only --no-owner --no-privileges "$1" |
              grep -v -e '^$' -e '^\\restrict ' -e '^\\unrestrict ' -e 'REPLICA IDENTITY' |
              awk '
                /^CREATE TABLE / { print; in_table = 1; next }
                in_table && /^\);/ { close("sort"); in_table = 0 }
                in_table { sub(/,$/, ""); print | "sort"; next }
                { print }
              '
          }
          schema_diff=$(diff -u <(dump_schema from_migrations) <(dump_schema from_schema)) || true
          for db in atlas_dev from_migrations from_schema; do
            psql_exec -d postgres -c "DROP DATABASE $db"
          done
          if [ -n "$schema_diff" ]; then
            echo "::error::infra/db/schema.sql is out of sync with infra/db/migrations:" >&2
            printf '%s\n' "$schema_diff" >&2
            exit 1
          fi

          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            base_dir=$(mktemp -d)
            git archive "FETCH_HEAD:infra/db/migrations" | tar -x -C "$base_dir"
            atlas migrate apply --dir "file://$base_dir" --url "$DATABASE_URL"
            rm -rf "$base_dir"
          fi

      - name: Apply migrations
        working-directory: ./infra
        run: atlas migrate apply --config file://db/atlas.hcl --env local

      - name: e2e test
        env:
          DEV_AUTH_ENABLED: "true"
        run: |
          cargo test --test '*'

      - name: Show container logs
        if: failure()
        working-directory: .
        run: docker compose -f infra/db/compose.yml logs

      - name: Stop containers
        if: always()
        working-directory: .
        run: docker compose -f infra/db/compose.yml down -v

