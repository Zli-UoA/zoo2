name: Home query budget
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'infra/db/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci-home-query-budget.yaml'
  workflow_call:
permissions:
  contents: read
concurrency:
  group: home-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  query-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: zoo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U root -d zoo" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://root:password@localhost:5432/zoo?sslmode=disable
      ACTIVITYPUB_BASE_URL: https://zoo.example.com
      DB_MAX_POOL_SIZE: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Read Rust version
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: backend
      - uses: ariga/setup-atlas@28f0b75814c08b1a265b75713c120cfad46433ae
      - name: Build benchmark before measuring
        run: cargo test --manifest-path backend/Cargo.toml --test home_scale_test --no-run
      - name: Measure 300k and 1m posts
        shell: bash
        env:
          PGPASSWORD: password
        run: |
          set -euo pipefail
          mkdir -p performance-results
          lscpu > performance-results/cpu.txt
          free -m > performance-results/memory.txt
          psql "$DATABASE_URL" -Atc "SELECT name,setting,unit FROM pg_settings WHERE name IN ('server_version','shared_buffers','work_mem','effective_cache_size','max_connections','jit','plan_cache_mode') ORDER BY name" > performance-results/postgres.txt
          for count in 300000 1000000; do
            db="budget_${count}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
            export DATABASE_URL="postgres://root:password@localhost:5432/$db?sslmode=disable"
            atlas migrate apply --dir file://infra/db/migrations --url "$DATABASE_URL"
            SCALE_POSTS="$count" SCALE_BUDGET=1 cargo test --manifest-path backend/Cargo.toml --test home_scale_test timeline_work_is_bounded -- --ignored --nocapture 2>&1 | tee "performance-results/${count}.log"
            cargo test --manifest-path backend/Cargo.toml --test home_scale_test persisted_home_handler_budget -- --ignored --nocapture 2>&1 | tee "performance-results/${count}-http.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-query-budget
          path: performance-results
