name: CI GitHub Bot
on:
  # merge-queue.yaml がマージキューで呼び出す。
  workflow_call:
    inputs:
      test-plan:
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/github-bot/**"
      - "sdk/**"
      # sdk の E2EE（sdk/src/e2ee.ts）は zoo-crypto の wasm を読む。サンプルの Bot もここで試す。
      - "examples/e2ee-echo-bot/**"
      - "crates/zoo-crypto/**"
      - "crates/zoo-crypto-wasm/**"
      - "rust-toolchain.toml"
      - ".github/actions/crypto-wasm/**"
      - ".github/workflows/select-tests.yaml"
      - ".github/scripts/*test-selection*.mjs"
      - ".github/workflows/ci-github-bot.yaml"
      - ".github/workflows/select-runner.yaml"
permissions:
  contents: read
concurrency:
  # PR と merge queue は新しい実行で古いものを止める。main は実行中のものを止めない（待機中の古いものは最新に置き換わる）。
  # 止めると、成功したジョブの最後に保存する Rust などのキャッシュが main に残らず、PR が cold build になる。
  group: github-bot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test-selection:
    if: inputs.test-plan == ''
    uses: ./.github/workflows/select-tests.yaml
    with:
      workflow: ci-github-bot

  runner:
    uses: ./.github/workflows/select-runner.yaml
    secrets:
      runner-status-token: ${{ secrets.RUNNER_STATUS_TOKEN }}
  test:
    if: >-
      !cancelled() && needs.runner.result == 'success' &&
      (inputs.test-plan != '' || needs.test-selection.result == 'success') &&
      (fromJSON(inputs.test-plan || needs.test-selection.outputs.plan || '{}').bots.bot)
    needs: [runner, test-selection]
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.docker-runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/github-bot/package-lock.json
      - run: npm ci --prefix apps/github-bot --ignore-scripts
      - run: npm --prefix apps/github-bot run check
      - run: node .github/scripts/node-test-selection.mjs bot
      - name: Build standalone bot image
        if: fromJSON(inputs.test-plan || needs.test-selection.outputs.plan || '{}').bots.image
        run: docker build -f apps/github-bot/Dockerfile -t zoo-github-bot:test .
      - name: Smoke-test the packaged server and SQLite as an unprivileged user
        if: fromJSON(inputs.test-plan || needs.test-selection.outputs.plan || '{}').bots.image
        run: |
          docker run --rm --entrypoint node zoo-github-bot:test --experimental-strip-types --input-type=module -e '
            import { Store } from "./apps/github-bot/src/store.ts";
            import { server } from "./apps/github-bot/src/server.ts";
            import assert from "node:assert/strict";
            assert.notEqual(process.getuid(), 0);
            const store = new Store(":memory:", Buffer.alloc(32, 1));
            const http = server({}, store);
            await new Promise(resolve => http.listen(0, "127.0.0.1", resolve));
            const response = await fetch(`http://127.0.0.1:${http.address().port}/health`);
            assert.equal(response.status, 200);
            http.closeAllConnections();
            await new Promise(resolve => http.close(resolve));
            store.close();
          '
  # sdk の E2EE（Bot の端末。#366）とサンプルの Bot。wasm（crates/zoo-crypto-wasm）を作ってから試す。
  sdk-e2ee:
    if: >-
      !cancelled() && needs.runner.result == 'success' &&
      (inputs.test-plan != '' || needs.test-selection.result == 'success') &&
      (fromJSON(inputs.test-plan || needs.test-selection.outputs.plan || '{}').bots.sdk)
    needs: [runner, test-selection]
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.runs-on || '"zli-kubecamp-no-docker"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Restore or build Wasm package
        uses: ./.github/actions/crypto-wasm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install dependency parser
        run: npm ci --prefix apps/github-bot --ignore-scripts
      - name: Test the E2EE sdk and the sample bot
        run: node .github/scripts/node-test-selection.mjs sdk

  publish:
    needs: [runner, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.docker-runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/github-bot/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/zli-uoa/zoo2-github-bot:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Zli-UoA/zoo2
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=github-bot
          cache-to: type=gha,mode=max,scope=github-bot
      - name: Check current main before promoting latest
        id: current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            core.setOutput('promote', data.commit.sha === context.sha);
      - name: Promote latest
        if: steps.current.outputs.promote == 'true'
        env:
          IMAGE: ghcr.io/zli-uoa/zoo2-github-bot
          IMAGE_SHA: ${{ github.sha }}
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$IMAGE_SHA"
