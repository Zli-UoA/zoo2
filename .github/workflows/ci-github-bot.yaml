name: CI GitHub Bot
on:
  # merge-queue.yaml がマージキューで呼び出す。
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/github-bot/**"
      - "sdk/**"
      # sdk の E2EE（sdk/src/e2ee.ts）は zoo-crypto の wasm を読む。サンプルの Bot もここで試す。
      - "examples/e2ee-echo-bot/**"
      - "crates/zoo-crypto/**"
      - "crates/zoo-crypto-wasm/**"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-github-bot.yaml"
      - ".github/workflows/select-runner.yaml"
  push:
    branches: [main]
    paths:
      - "apps/github-bot/**"
      - "sdk/**"
      # sdk の E2EE（sdk/src/e2ee.ts）は zoo-crypto の wasm を読む。サンプルの Bot もここで試す。
      - "examples/e2ee-echo-bot/**"
      - "crates/zoo-crypto/**"
      - "crates/zoo-crypto-wasm/**"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-github-bot.yaml"
      - ".github/workflows/select-runner.yaml"
permissions:
  contents: read
concurrency:
  group: github-bot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  runner:
    uses: ./.github/workflows/select-runner.yaml
    secrets:
      runner-status-token: ${{ secrets.RUNNER_STATUS_TOKEN }}
  test:
    needs: runner
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.docker-runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/github-bot/package-lock.json
      - run: npm ci --prefix apps/github-bot --ignore-scripts
      - run: npm --prefix apps/github-bot run check
      - run: npm --prefix apps/github-bot test
      - run: node --experimental-strip-types --test sdk/src/index.test.ts
      - name: Build standalone bot image
        run: docker build -f apps/github-bot/Dockerfile -t zoo-github-bot:test .
      - name: Smoke-test the packaged server and SQLite as an unprivileged user
        run: |
          docker run --rm --entrypoint node zoo-github-bot:test --experimental-strip-types --input-type=module -e '
            import { Store } from "./apps/github-bot/src/store.ts";
            import { server } from "./apps/github-bot/src/server.ts";
            import assert from "node:assert/strict";
            assert.notEqual(process.getuid(), 0);
            const store = new Store(":memory:", Buffer.alloc(32, 1));
            const http = server({}, store);
            await new Promise(resolve => http.listen(0, "127.0.0.1", resolve));
            const response = await fetch(`http://127.0.0.1:${http.address().port}/health`);
            assert.equal(response.status, 200);
            http.closeAllConnections();
            await new Promise(resolve => http.close(resolve));
            store.close();
          '
  # sdk の E2EE（Bot の端末。#366）とサンプルの Bot。wasm（crates/zoo-crypto-wasm）を作ってから試す。
  sdk-e2ee:
    needs: runner
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.runs-on || '"zli-kubecamp-no-docker"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read Rust toolchain and wasm-bindgen version
        id: versions
        run: |
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "wasm-bindgen=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/zoo-crypto-wasm/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.channel }}
          targets: wasm32-unknown-unknown
      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          # キャッシュの保存は main だけにする（ci-frontend.yaml の crypto-wasm と同じ）。
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: crates/zoo-crypto-wasm
      # cargo install は毎回ソースからビルドして約90秒かかるので、版ごとにバイナリーをキャッシュする。
      - name: Restore wasm-bindgen-cli
        id: wasm-bindgen-cli
        uses: actions/cache@v6
        with:
          path: ~/.cargo-tools
          key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-wasm-bindgen-cli-${{ steps.versions.outputs.wasm-bindgen }}
      - name: Install wasm-bindgen-cli
        if: steps.wasm-bindgen-cli.outputs.cache-hit != 'true'
        run: cargo install --locked --root "$HOME/.cargo-tools" wasm-bindgen-cli --version "${{ steps.versions.outputs.wasm-bindgen }}"
      - name: Add cached tools to PATH
        run: echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"
      - name: Build wasm package
        run: crates/zoo-crypto-wasm/build.sh
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Test the E2EE sdk and the sample bot
        run: node --experimental-strip-types --test sdk/src/e2ee.test.ts examples/e2ee-echo-bot/echo.test.ts

  publish:
    needs: [runner, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.docker-runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/github-bot/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/zli-uoa/zoo2-github-bot:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Zli-UoA/zoo2
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=github-bot
          cache-to: type=gha,mode=max,scope=github-bot
      - name: Check current main before promoting latest
        id: current
        uses: actions/github-script@v9
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            core.setOutput('promote', data.commit.sha === context.sha);
      - name: Promote latest
        if: steps.current.outputs.promote == 'true'
        env:
          IMAGE: ghcr.io/zli-uoa/zoo2-github-bot
          IMAGE_SHA: ${{ github.sha }}
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$IMAGE_SHA"
