name: CI Desktop Tauri
on:
  # merge-queue.yaml がマージキューで呼び出す。
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "client-core/**"
      - "client-types/**"
      - "crates/zoo-components/**"
      - "desktop-tauri/**"
      - "rust-toolchain.toml"
      - ".github/scripts/*test-selection*.mjs"
      - ".github/workflows/select-tests.yaml"
      - ".github/workflows/ci-desktop-tauri.yaml"
  push:
    branches: [main]
    paths:
      - "client-core/**"
      - "client-types/**"
      - "crates/zoo-components/**"
      - "desktop-tauri/**"
      - "rust-toolchain.toml"
      - ".github/scripts/*test-selection*.mjs"
      - ".github/workflows/select-tests.yaml"
      - ".github/workflows/ci-desktop-tauri.yaml"
permissions:
  contents: read
concurrency:
  # PR と merge queue は新しい実行で古いものを止める。main は実行中のものを止めない（待機中の古いものは最新に置き換わる）。
  # 止めると、成功したジョブの最後に保存する Rust などのキャッシュが main に残らず、PR が cold build になる。
  group: desktop-tauri-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# WebKitGTK などの apt パッケージが要るため、GitHub ホストの実行先を使う。
# AppImage は NixOS では作れないので、ここで deb と一緒に作って成果物にする。
jobs:
  test-selection:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/select-tests.yaml
    with:
      workflow: ci-desktop-tauri

  check:
    if: github.event_name != 'pull_request' && fromJSON(needs.test-selection.outputs.desktopTauri).check
    needs: test-selection
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # clippy と test の dev プロファイルのデバッグ情報を行番号だけにして、target のキャッシュ（約 1.1GB）を小さくする。
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libdbus-1-dev \
            libxdo-dev \
            file
      - name: macOS のビルド再試行を検証する
        run: node --test desktop-tauri/scripts/build-macos.test.mjs
      - name: Read Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Restore Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # キャッシュの保存は main だけにする。PR ごとに数百 MB ずつ保存すると、容量の上限（10GB）を超えて、main のキャッシュも追い出される。
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            desktop-tauri/src-tauri
            desktop-tauri/ui
      # cargo install は毎回ソースからビルドして数分かかるので、版ごとにバイナリーをキャッシュする。
      - name: Restore cargo tools
        id: cargo-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo-tools
          key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-wasm-bindgen-cli-0.2.129-tauri-cli-2.11.4
      - name: Install trunk, wasm-bindgen and tauri-cli
        # wasm-bindgen は desktop-tauri/ui/Cargo.toml で固定した版と合わせる。
        run: |
          # trunk は ~/.cargo/bin がない実行先 (macOS) もあるので、専用の場所に置いて PATH に足す。
          trunk_bin="$HOME/.local/trunk/bin"
          mkdir -p "$trunk_bin"
          echo "$trunk_bin" >> "$GITHUB_PATH"
          # チェックサムを確かめてから展開する。
          curl -fsSL -o "$RUNNER_TEMP/trunk.tar.gz" https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  $RUNNER_TEMP/trunk.tar.gz" | sha256sum -c -
          tar -xz -C "$trunk_bin" -f "$RUNNER_TEMP/trunk.tar.gz"
          echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"
          if [ "${{ steps.cargo-tools.outputs.cache-hit }}" != "true" ]; then
            cargo install --locked --root "$HOME/.cargo-tools" wasm-bindgen-cli --version 0.2.129
            cargo install --locked --root "$HOME/.cargo-tools" tauri-cli --version 2.11.4
          fi
      - name: format check
        run: |
          cargo fmt --check --manifest-path desktop-tauri/src-tauri/Cargo.toml
          cargo fmt --check --manifest-path desktop-tauri/ui/Cargo.toml
      # tauri::generate_context! は ui/dist を読むので、clippy とテストより先に作る。
      - name: build ui
        working-directory: ./desktop-tauri/ui
        run: trunk build --release
      - name: lint check (ui)
        working-directory: ./desktop-tauri/ui
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: lint check
        working-directory: ./desktop-tauri/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        working-directory: ./desktop-tauri/src-tauri
        run: cargo test --locked
      - name: test updater verification script
        run: node --test desktop-tauri/scripts/verify-tauri-updater.test.mjs
      - name: bundle (deb, AppImage)
        working-directory: ./desktop-tauri/src-tauri
        run: cargo tauri build --bundles deb,appimage -- --locked
      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zoo2-desktop-tauri-linux
          path: |
            desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
            desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7

  # macOS でもビルドできることを確かめる。リリース (cd-desktop-tauri-release.yaml) と同じ universal の
  # .app を作る。Developer ID の署名と公証はまだしない (ad-hoc 署名だけ)。
  macos:
    if: github.event_name != 'pull_request' && fromJSON(needs.test-selection.outputs.desktopTauri).macos
    needs: test-selection
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: clippy
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
      - name: Restore Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # キャッシュの保存は main だけにする。PR ごとに数百 MB ずつ保存すると、容量の上限（10GB）を超えて、main のキャッシュも追い出される。
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            desktop-tauri/src-tauri
            desktop-tauri/ui
      # cargo install は毎回ソースからビルドして数分かかるので、版ごとにバイナリーをキャッシュする。
      - name: Restore cargo tools
        id: cargo-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo-tools
          key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-wasm-bindgen-cli-0.2.129-tauri-cli-2.11.4
      - name: Install trunk, wasm-bindgen and tauri-cli
        run: |
          # trunk は ~/.cargo/bin がない実行先 (macOS) もあるので、専用の場所に置いて PATH に足す。
          trunk_bin="$HOME/.local/trunk/bin"
          mkdir -p "$trunk_bin"
          echo "$trunk_bin" >> "$GITHUB_PATH"
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-aarch64-apple-darwin.tar.gz | tar -xz -C "$trunk_bin"
          echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"
          if [ "${{ steps.cargo-tools.outputs.cache-hit }}" != "true" ]; then
            cargo install --locked --root "$HOME/.cargo-tools" wasm-bindgen-cli --version 0.2.129
            cargo install --locked --root "$HOME/.cargo-tools" tauri-cli --version 2.11.4
          fi
      - name: build ui
        working-directory: ./desktop-tauri/ui
        run: trunk build --release
      # macOS でだけ使う (または使わない) コードの警告を拾う。
      - name: lint check
        working-directory: ./desktop-tauri/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        working-directory: ./desktop-tauri/src-tauri
        run: cargo test --locked
      - name: bundle (app, dmg)
        working-directory: ./desktop-tauri/src-tauri
        run: cargo tauri build --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}' -- --locked
      # 通話のマイクとカメラに要る entitlement と、使用目的の説明が、署名したアプリに入っているか。
      - name: Check entitlements and usage descriptions
        working-directory: ./desktop-tauri/src-tauri/target/universal-apple-darwin/release/bundle/macos
        run: |
          entitlements=$(codesign -d --entitlements - --xml zoo2.app)
          for key in com.apple.security.device.audio-input com.apple.security.device.camera; do
            grep -q "$key" <<<"$entitlements" || { echo "::error::$key がありません"; exit 1; }
          done
          for key in NSMicrophoneUsageDescription NSCameraUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$key" zoo2.app/Contents/Info.plist
          done
      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zoo2-desktop-tauri-macos
          path: desktop-tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7

  # Windows でもビルドと Inno Setup インストーラー生成ができることを確かめる。
  windows:
    if: github.event_name != 'pull_request' && fromJSON(needs.test-selection.outputs.desktopTauri).windows
    needs: test-selection
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read Rust toolchain
        id: rust-toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $channel = (Get-Content rust-toolchain.toml | Select-String '^channel = "(.*)"$' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 1)
          if (-not $channel) { throw "Failed to read toolchain channel from rust-toolchain.toml" }
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: clippy
          targets: wasm32-unknown-unknown
      - name: Restore Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # キャッシュの保存は main だけにする。
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            desktop-tauri/src-tauri
            desktop-tauri/ui
            client-core
      # cargo install は毎回ソースからビルドして数分かかるので、版ごとにバイナリーをキャッシュする。
      - name: Restore cargo tools
        id: cargo-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo-tools
          key: cargo-tools-${{ runner.os }}-${{ runner.arch }}-wasm-bindgen-cli-0.2.129-tauri-cli-2.11.4
      - name: Install trunk, wasm-bindgen and tauri-cli
        run: |
          $ErrorActionPreference = 'Stop'
          $trunkBin = Join-Path $env:USERPROFILE ".local\trunk\bin"
          New-Item -ItemType Directory -Force -Path $trunkBin | Out-Null
          $trunkBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $trunkZip = Join-Path $env:RUNNER_TEMP "trunk.zip"
          Invoke-WebRequest -Uri "https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-pc-windows-msvc.zip" -OutFile $trunkZip
          $actualHash = (Get-FileHash -Algorithm SHA256 $trunkZip).Hash.ToLowerInvariant()
          $expectedHash = "cd6ac15b9daff0365e5695036791ef2ce3c63f61c014f5a8c532363266e4569c"
          if ($actualHash -ne $expectedHash) {
            throw "trunk SHA-256 mismatch: expected $expectedHash, got $actualHash"
          }
          Expand-Archive -Path $trunkZip -DestinationPath $trunkBin -Force
          $cargoTools = Join-Path $env:USERPROFILE ".cargo-tools"
          $cargoToolsBin = Join-Path $cargoTools "bin"
          $cargoToolsBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if ('${{ steps.cargo-tools.outputs.cache-hit }}' -ne 'true') {
            cargo install --locked --root $cargoTools wasm-bindgen-cli --version 0.2.129
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo install --locked --root $cargoTools tauri-cli --version 2.11.4
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Install Inno Setup
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc -and (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          $probe = "#if Ver < EncodeVer(6, 5, 2)`n#error old`n#endif`n[Setup]`nAppName=t`nAppVersion=1.0`nDefaultDirName={autopf}\t"
          $needInstall = $true
          if ($iscc -and (Test-Path $iscc)) {
            $probe | & $iscc /Q /O- - | Out-Null
            if ($LASTEXITCODE -eq 0) { $needInstall = $false }
          }
          if ($needInstall) {
            choco upgrade innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $iscc = $null
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            } else {
              $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
            }
          }
          if (-not $iscc -or -not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          $probe | & $iscc /Q /O- - | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC.exe >= 6.5.2 is required (resolved: $iscc)"
          }
          Split-Path -Parent $iscc | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: build ui
        working-directory: ./desktop-tauri/ui
        run: |
          $ErrorActionPreference = 'Stop'
          trunk build --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Windows でだけ使う (または使わない) コードの警告とテストを拾う。
      - name: lint check
        run: |
          $ErrorActionPreference = 'Stop'
          cargo clippy --all-targets --locked --manifest-path client-core/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --all-targets --locked --manifest-path desktop-tauri/src-tauri/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: test
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked --manifest-path client-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path desktop-tauri/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: bundle (Inno Setup)
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location desktop-tauri\src-tauri
          try {
            cargo tauri build --no-bundle -- --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          $version = (Get-Content desktop-tauri\src-tauri\Cargo.toml | Select-String '^version = "(.*)"$' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 1)
          if (-not $version) { throw "Failed to read version from desktop-tauri/src-tauri/Cargo.toml" }
          iscc.exe "/DAppVersion=$version" desktop-tauri\installer\zoo2.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: verify updater signature and manifest format
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content desktop-tauri\src-tauri\Cargo.toml | Select-String '^version = "(.*)"$' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 1)
          $setupName = "zoo2_${version}_x64-setup.exe"
          $setupSrc = Join-Path "desktop-tauri\src-tauri\target\release\bundle\inno" $setupName
          if (-not (Test-Path $setupSrc)) { throw "Missing installer: $setupSrc" }
          $work = Join-Path $env:RUNNER_TEMP "verify-updater"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          try {
            $setupCopy = Join-Path $work $setupName
            Copy-Item $setupSrc $setupCopy
            $keyFile = Join-Path $work "test.key"
            cargo tauri signer generate -w $keyFile --ci --force -p "ci-verify"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo tauri signer sign -f $keyFile -p "ci-verify" $setupCopy
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $pubkey = (Get-Content -Raw "$keyFile.pub").Trim()
            $sig = (Get-Content -Raw "$setupCopy.sig").Trim()
            $manifestPath = Join-Path $work "latest.json"
            $manifest = @{
              version = $version
              notes = "https://github.com/Zli-UoA/zoo2/releases/tag/desktop-tauri-v$version"
              pub_date = "2026-01-01T00:00:00Z"
              platforms = @{
                "windows-x86_64" = @{
                  url = "https://github.com/Zli-UoA/zoo2/releases/download/desktop-tauri-v$version/$setupName"
                  signature = $sig
                }
              }
            } | ConvertTo-Json -Depth 5
            [System.IO.File]::WriteAllText($manifestPath, $manifest, [System.Text.UTF8Encoding]::new($false))
            node desktop-tauri\scripts\verify-tauri-updater.mjs --manifest $manifestPath --dir $work --pubkey $pubkey --require windows-x86_64 --verify-files
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          }
      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zoo2-desktop-tauri-windows
          path: desktop-tauri/src-tauri/target/release/bundle/inno/*.exe
          if-no-files-found: error
          retention-days: 7
