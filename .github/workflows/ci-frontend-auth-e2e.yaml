name: CI Frontend Auth E2E
on:
  # merge-queue.yaml がマージキューで呼び出す。
  workflow_call:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      # frontend が link: 依存で読む E2EE の wasm（@zoo/crypto-wasm）。
      - "crates/zoo-crypto/**"
      - "crates/zoo-crypto-wasm/**"
      - "rust-toolchain.toml"
      - "infra/db/**"
      - ".github/workflows/ci-frontend-auth-e2e.yaml"
      - ".github/workflows/select-runner.yaml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      # frontend が link: 依存で読む E2EE の wasm（@zoo/crypto-wasm）。
      - "crates/zoo-crypto/**"
      - "crates/zoo-crypto-wasm/**"
      - "rust-toolchain.toml"
      - "infra/db/**"
      - ".github/workflows/ci-frontend-auth-e2e.yaml"
      - ".github/workflows/select-runner.yaml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-frontend-auth-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# runner ジョブがDocker不要用とDocker必須用の実行先を選びます。
jobs:
  runner:
    uses: ./.github/workflows/select-runner.yaml
    secrets:
      runner-status-token: ${{ secrets.RUNNER_STATUS_TOKEN }}

  # E2EE の wasm（crates/zoo-crypto-wasm/pkg）。アプリが lib/e2ee を読むので、dev サーバーの起動に要る（#359）。
  crypto-wasm:
    needs: runner
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.runs-on || '"zli-kubecamp-no-docker"') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # この後のビルドで動く依存のコードから、GitHub のトークンを読めないようにする。
          persist-credentials: false
      - name: Read Rust toolchain and wasm-bindgen version
        id: versions
        run: |
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "wasm-bindgen=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/zoo-crypto-wasm/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.versions.outputs.channel }}
          targets: wasm32-unknown-unknown
      - name: Restore Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # キャッシュの保存は main だけにする。PR ごとに数百 MB ずつ保存すると、容量の上限（10GB）を超えて、main のキャッシュも追い出される。
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: crates/zoo-crypto-wasm
      - name: Install wasm-bindgen-cli
        # crates/zoo-crypto-wasm/Cargo.toml で = 固定した wasm-bindgen と同じ版にする（build.sh が照合する）。
        run: |
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen ${{ steps.versions.outputs.wasm-bindgen }}" ]; then
            cargo install --locked wasm-bindgen-cli --version "${{ steps.versions.outputs.wasm-bindgen }}"
          fi
      - name: Build wasm package
        run: crates/zoo-crypto-wasm/build.sh
      - name: Upload wasm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # マージキューでは ci-frontend などと同じ run で呼ばれるので、artifact の名前を分ける。
          name: zoo-crypto-wasm-auth-e2e
          path: crates/zoo-crypto-wasm/pkg
          if-no-files-found: error
          retention-days: 1

  oidc-e2e:
    needs: [runner, crypto-wasm]
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.docker-runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 30
    env:
      # Each job owns its containers and dynamically assigned host ports.
      COMPOSE_PROJECT_NAME: zoo-ci-oidc-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PORT: "0"
      ELECTRIC_PORT: "0"
      S3_PORT: "0"
      S3_CONSOLE_PORT: "0"
      # 本番同等の認証経路（Bearer + JWKS）を通す。dev の X-Dev-User は使わない。
      ENVIRONMENT: production
      DEV_AUTH_ENABLED: "false"
      OIDC_ISSUER: http://127.0.0.1:4100/oauth2/openid/zoo
      OIDC_AUDIENCE: zoo
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      S3_ENDPOINT: https://example.r2.cloudflarestorage.com
      S3_BUCKET: zoo-attachments-prod
      S3_ACCESS_KEY_ID: dummy-prod-access-key
      S3_SECRET_ACCESS_KEY: dummy-prod-secret-key
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pull and boot the databases while the frontend and Rust are set up.
      # "Wait for PostgreSQL and Electric" below waits until they are healthy.
      - name: Start PostgreSQL and Electric
        working-directory: .
        run: |
          nohup docker compose -f infra/db/compose.yml up -d --wait \
            > "$RUNNER_TEMP/compose-up.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/compose-up.pid"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Download wasm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: zoo-crypto-wasm-auth-e2e
          path: crates/zoo-crypto-wasm/pkg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # The self-hosted runner image already has the system libraries.
      - name: Install Playwright browser
        run: pnpm exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium

      - name: Read Rust toolchain
        id: rust-toolchain
        working-directory: .
        # Install only the toolchain pinned in rust-toolchain.toml, not stable as well.
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # キャッシュの保存は main だけにする。PR ごとに数百 MB ずつ保存すると、容量の上限（10GB）を超えて、main のキャッシュも追い出される。
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: backend
          # Kept apart from ci-backend.yaml's check job, which also caches clippy and tests.
          shared-key: backend-debug
          # Keep the build cache even when the E2E test fails.
          cache-on-failure: true

      - name: Build backend
        working-directory: ./backend
        run: cargo build

      - name: Wait for PostgreSQL and Electric
        working-directory: .
        run: |
          # Let the background start finish first so two `up` runs never race.
          pid=$(cat "$RUNNER_TEMP/compose-up.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          cat "$RUNNER_TEMP/compose-up.log"
          # Idempotent: fails here if a service did not become healthy.
          docker compose -f infra/db/compose.yml up -d --wait
          postgres_port=$(docker compose -f infra/db/compose.yml port postgres 5432)
          electric_port=$(docker compose -f infra/db/compose.yml port electric 3000)
          echo "DATABASE_URL=postgres://root:password@${postgres_port}/zoo?sslmode=disable" >> "$GITHUB_ENV"
          echo "ELECTRIC_URL=http://${electric_port}" >> "$GITHUB_ENV"

      - name: Setup Atlas
        uses: ariga/setup-atlas@28f0b75814c08b1a265b75713c120cfad46433ae # v0

      - name: Apply migrations
        working-directory: ./infra
        run: atlas migrate apply --config file://db/atlas.hcl --env local

      - name: Run OIDC E2E (mock IdP + production auth)
        run: |
          set -eu
          ../backend/target/debug/zoo_backend > /tmp/backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health > /dev/null
          pnpm test:e2e:oidc

      - name: Backend logs
        if: failure()
        working-directory: .
        run: |
          if [ -f /tmp/backend.log ]; then cat /tmp/backend.log; fi
          docker compose -f infra/db/compose.yml logs postgres electric

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-oidc
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7

      - name: Stop containers
        if: always()
        working-directory: .
        run: docker compose -f infra/db/compose.yml down -v --remove-orphans
