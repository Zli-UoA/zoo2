name: CI Frontend Auth E2E
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "infra/db/**"
      - ".github/workflows/ci-frontend-auth-e2e.yaml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "infra/db/**"
      - ".github/workflows/ci-frontend-auth-e2e.yaml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  oidc-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://root:password@localhost:5432/zoo?sslmode=disable
      ELECTRIC_URL: http://127.0.0.1:3000
      # 本番同等の認証経路（Bearer + JWKS）を通す。dev の X-Dev-User は使わない。
      ENVIRONMENT: production
      DEV_AUTH_ENABLED: "false"
      OIDC_ISSUER: http://127.0.0.1:4100/oauth2/openid/zoo
      OIDC_AUDIENCE: zoo
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      S3_ENDPOINT: https://example.r2.cloudflarestorage.com
      S3_BUCKET: zoo-attachments-prod
      S3_ACCESS_KEY_ID: dummy-prod-access-key
      S3_SECRET_ACCESS_KEY: dummy-prod-secret-key
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build backend
        working-directory: ./backend
        run: cargo build

      - name: Start PostgreSQL and Electric
        working-directory: .
        run: docker compose -f infra/db/compose.yml up -d --wait

      - name: Setup Atlas
        uses: ariga/setup-atlas@v0

      - name: Apply migrations
        working-directory: ./infra
        run: atlas migrate apply --config file://db/atlas.hcl --env local

      - name: Run OIDC E2E (mock IdP + production auth)
        run: |
          set -eu
          ../backend/target/debug/zoo_backend > /tmp/backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health > /dev/null
          pnpm test:e2e:oidc

      - name: Backend logs
        if: failure()
        run: cat /tmp/backend.log

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-oidc
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7

      - name: Stop containers
        if: always()
        working-directory: .
        run: docker compose -f infra/db/compose.yml down -v
