name: CI Compose Web
on:
  pull_request:
    paths:
      - "frontend-compose/**"
      - "frontend/**"
      - "infra/frontend-nginx.conf"
      - "infra/Dockerfile-frontend-deploy*"
      - ".github/workflows/ci-compose.yaml"
  push:
    branches: [main]
    paths:
      - "frontend-compose/**"
      - "frontend/**"
      - "infra/frontend-nginx.conf"
      - "infra/Dockerfile-frontend-deploy*"
      - ".github/workflows/ci-compose.yaml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          echo "ZOO_CHROME=$(node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/zoo-chrome" <<'SH'
          #!/bin/sh
          exec "$ZOO_CHROME" --no-sandbox "$@"
          SH
          chmod +x "$RUNNER_TEMP/zoo-chrome"
          echo "CHROME_BIN=$RUNNER_TEMP/zoo-chrome" >> "$GITHUB_ENV"
      - name: Test Kotlin and generate Web distribution
        working-directory: frontend-compose
        run: ./gradlew --no-daemon wasmJsBrowserTest wasmJsBrowserDistribution -Pzoo.systemNode=true
      - name: Build frontend with opt-in Compose assets
        working-directory: frontend
        env:
          ZOO_COMPOSE_SYSTEM_NODE: "true"
          VITE_EXPERIMENTAL_COMPOSE: "true"
          VITE_PREVIEW_AUTH: "true"
          VITE_API_BASE_URL: ""
        run: |
          pnpm build:compose
          pnpm build
      - name: Test existing and native Compose workflows
        working-directory: frontend
        run: pnpm exec playwright test --config playwright.compose.config.ts --grep 'entry points|CRUD|storage failure'
      - name: Test production CSP and offline reload
        working-directory: frontend
        run: pnpm exec playwright test --config playwright.compose-production.config.ts
      - name: Report exact UI parity
        continue-on-error: true
        working-directory: frontend
        run: pnpm exec playwright test --config playwright.compose.config.ts --grep 'panes preserve'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compose-web-test-results
          path: frontend/test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: compose-web-preview
          path: frontend/dist/client/
          retention-days: 7
          if-no-files-found: error
