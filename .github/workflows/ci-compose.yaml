name: CI Compose Web
on:
  pull_request:
    paths:
      - "frontend-compose/**"
      - "frontend/**"
      - "infra/frontend-nginx.conf"
      - "infra/Dockerfile-frontend-deploy*"
      - ".github/workflows/ci-compose.yaml"
  push:
    branches: [main]
    paths:
      - "frontend-compose/**"
      - "frontend/**"
      - "infra/frontend-nginx.conf"
      - "infra/Dockerfile-frontend-deploy*"
      - ".github/workflows/ci-compose.yaml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runner:
    uses: ./.github/workflows/select-runner.yaml
    secrets:
      runner-status-token: ${{ secrets.RUNNER_STATUS_TOKEN }}

  web:
    needs: runner
    env:
      BINARYEN_CORES: "1"
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(needs.runner.outputs.large-runs-on || '"zli-k8s"') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          echo "ZOO_CHROME=$(node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/zoo-chrome" <<'SH'
          #!/bin/sh
          exec "$ZOO_CHROME" --no-sandbox "$@"
          SH
          chmod +x "$RUNNER_TEMP/zoo-chrome"
          echo "CHROME_BIN=$RUNNER_TEMP/zoo-chrome" >> "$GITHUB_ENV"
      - name: Test Kotlin and generate Web distribution
        working-directory: frontend-compose
        run: ./gradlew --no-daemon wasmJsBrowserTest wasmJsBrowserDistribution -Pzoo.systemNode=true
      - name: Build frontend with opt-in Compose assets
        working-directory: frontend
        env:
          ZOO_COMPOSE_SYSTEM_NODE: "true"
          VITE_EXPERIMENTAL_COMPOSE: "true"
          VITE_PREVIEW_AUTH: "true"
          VITE_API_BASE_URL: ""
        run: |
          pnpm build:compose
          pnpm build
      - name: Test existing and native Compose workflows
        working-directory: frontend
        run: pnpm exec playwright test --config playwright.compose.config.ts
      - name: Test production CSP and offline reload
        working-directory: frontend
        run: pnpm exec playwright test --config playwright.compose-production.config.ts
      - name: Build and test Compose Storybook catalog
        working-directory: frontend
        run: |
          pnpm build-storybook
          pnpm exec playwright test --config playwright.compose-storybook.config.ts
          pnpm exec playwright test --config playwright.compose-shell-contracts.config.ts
          pnpm exec playwright test --config playwright.compose-shell-api-contracts.config.ts
      - name: Verify every Story and capture React and Kotlin UI
        working-directory: frontend
        run: pnpm exec playwright test --config playwright.storybook-parity.config.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compose-web-test-results
          path: frontend/test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: compose-web-preview
          path: frontend/dist/client/
          retention-days: 7
          if-no-files-found: error

  container:
    needs: runner
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(needs.runner.outputs.docker-runs-on || '"zli-k8s"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build opt-in frontend container from source
        run: |
          started=$SECONDS
          docker build -f infra/Dockerfile-frontend-deploy --build-arg VITE_EXPERIMENTAL_COMPOSE=true -t zoo-compose-ci .
          echo "Cold opt-in frontend container build: $((SECONDS - started)) seconds" >> "$GITHUB_STEP_SUMMARY"
      - name: Check opt-in assets and conditional CSP
        run: |
          docker run -d --name zoo-compose-ci -p 127.0.0.1:3101:3000 zoo-compose-ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3101/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS -D /tmp/compose-headers http://127.0.0.1:3101/compose/zoo-compose.js -o /tmp/compose-entry.js
          test -s /tmp/compose-entry.js
          grep -q "connect-src.*https://www.gstatic.com" /tmp/compose-headers
          docker exec zoo-compose-ci sh -c 'test -n "$(find /usr/share/nginx/html/compose -name "*.wasm")"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3101/compose/missing.js)" = 404
      - name: Container logs
        if: always()
        run: docker logs zoo-compose-ci 2>/dev/null || true
      - name: Stop test container
        if: always()
        run: docker rm -f zoo-compose-ci 2>/dev/null || true
