name: CI Android
on:
  pull_request:
    paths:
      - "frontend-compose/**"
      - "frontend/src/lib/i18n/locales/**"
      - "frontend/public/icons/**"
      - ".github/workflows/ci-android.yaml"
  push:
    branches: [main]
    paths:
      - "frontend-compose/**"
      - "frontend/src/lib/i18n/locales/**"
      - "frontend/public/icons/**"
      - ".github/workflows/ci-android.yaml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint Android
        working-directory: frontend-compose
        run: ./gradlew --no-daemon -Pzoo.android=true :androidApp:assembleDebug :androidApp:testDebugUnitTest :androidApp:lintDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: zoo-android-debug
          path: frontend-compose/androidApp/build/outputs/apk/debug/*.apk
