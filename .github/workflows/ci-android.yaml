name: CI Android
on:
  # merge-queue.yaml がマージキューで呼び出す。
  workflow_call:
  pull_request:
    paths:
      - "frontend-compose/**"
      - "frontend/src/lib/i18n/locales/**"
      - "frontend/public/icons/**"
      # zoo-crypto の UniFFI バインディング（#353）。APK に .so を入れ、単体テストでも使う。
      - "crates/zoo-crypto/**"
      - "crates/zoo-crypto-ffi/**"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-android.yaml"
      - ".github/scripts/android-update-manifest*.py"
  push:
    branches: [main]
    # Android に関係しない変更 (TUI、backend など) では、検証も main の公開もやり直さない。
    # pull_request の paths と同じ一覧にする。
    paths:
      - "frontend-compose/**"
      - "frontend/src/lib/i18n/locales/**"
      - "frontend/public/icons/**"
      # zoo-crypto の UniFFI バインディング（#353）。APK に .so を入れ、単体テストでも使う。
      - "crates/zoo-crypto/**"
      - "crates/zoo-crypto-ffi/**"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-android.yaml"
      - ".github/scripts/android-update-manifest*.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          # NDK は zoo-crypto のバインディング（crates/zoo-crypto-ffi）を cargo-ndk でビルドするのに使う。
          # 版は flake.nix の androidNdkVersion と同じ。
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865
          log-accepted-android-sdk-licenses: false
      - name: Use the Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Read Rust toolchain
        id: rust-toolchain
        # Install only the toolchain pinned in rust-toolchain.toml, not stable as well.
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: clippy, rustfmt
          # frontend-compose/build.gradle.kts の cryptoAbis と同じ ABI。
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/zoo-crypto-ffi
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk@4.1.2
      - name: Restore Gradle wrapper distribution
        id: gradle-wrapper
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('frontend-compose/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Download Gradle wrapper distribution
        if: steps.gradle-wrapper.outputs.cache-hit != 'true'
        working-directory: frontend-compose
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle wrapper download failed (attempt $attempt); retrying" >&2
            sleep $((attempt * 20))
          done
          exit 1
      # Save right after the download so later dependency failures do not discard it.
      - name: Save Gradle wrapper distribution
        if: steps.gradle-wrapper.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ steps.gradle-wrapper.outputs.cache-primary-key }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Test update manifest generation
        run: python3 .github/scripts/android-update-manifest.test.py
      - name: Check zoo-crypto-ffi (fmt, clippy, test)
        working-directory: crates/zoo-crypto-ffi
        run: cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked
      - name: Build, test and lint Android
        working-directory: frontend-compose
        run: ./gradlew --no-daemon -Pzoo.android=true :androidApp:assembleDebug :androidApp:testDebugUnitTest :androidApp:lintDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: zoo-android-debug
          path: frontend-compose/androidApp/build/outputs/apk/debug/*.apk

  publish-main:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-main-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          # NDK は zoo-crypto のバインディング（crates/zoo-crypto-ffi）を cargo-ndk でビルドするのに使う。
          # 版は flake.nix の androidNdkVersion と同じ。
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865
          log-accepted-android-sdk-licenses: false
      - name: Use the Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Read Rust toolchain
        id: rust-toolchain
        # Install only the toolchain pinned in rust-toolchain.toml, not stable as well.
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: clippy, rustfmt
          # frontend-compose/build.gradle.kts の cryptoAbis と同じ ABI。
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/zoo-crypto-ffi
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk@4.1.2
      - name: Restore Gradle wrapper distribution
        id: gradle-wrapper
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('frontend-compose/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Download Gradle wrapper distribution
        if: steps.gradle-wrapper.outputs.cache-hit != 'true'
        working-directory: frontend-compose
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle wrapper download failed (attempt $attempt); retrying" >&2
            sleep $((attempt * 20))
          done
          exit 1
      # Save right after the download so later dependency failures do not discard it.
      - name: Save Gradle wrapper distribution
        if: steps.gradle-wrapper.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ steps.gradle-wrapper.outputs.cache-primary-key }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with the persistent Android signing key
        working-directory: frontend-compose
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ZOO_ANDROID_KEYSTORE: ${{ runner.temp }}/zoo-release.jks
          ZOO_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ZOO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZOO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Configure ANDROID_KEYSTORE_BASE64}"
          : "${ZOO_ANDROID_STORE_PASSWORD:?Configure ANDROID_STORE_PASSWORD}"
          : "${ZOO_ANDROID_KEY_ALIAS:?Configure ANDROID_KEY_ALIAS}"
          : "${ZOO_ANDROID_KEY_PASSWORD:?Configure ANDROID_KEY_PASSWORD}"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['ZOO_ANDROID_KEYSTORE'])
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
          version_code=$(git rev-list --first-parent --count HEAD)
          version_name="main.${version_code}-${GITHUB_SHA:0:7}"
          ./gradlew --no-daemon -Pzoo.android=true -Pzoo.android.versionCode="$version_code" -Pzoo.android.versionName="$version_name" :androidApp:assembleRelease :androidApp:testReleaseUnitTest :androidApp:lintRelease
          apk="$RUNNER_TEMP/zoo-android-main-$GITHUB_SHA.apk"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          python3 ../.github/scripts/android-update-manifest.py "$apk" "$version_code" "$version_name" "$GITHUB_SHA" "$RUNNER_TEMP/update.json"
      - name: Publish the main update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            # push の paths と同じ一覧。Android に関係しない新しいコミット (TUI など) はビルドを起動しないので、
            # それだけが後から入ったときは、このビルドが最新の Android と同じ内容として公開する。
            paths=(frontend-compose frontend/src/lib/i18n/locales frontend/public/icons crates/zoo-crypto crates/zoo-crypto-ffi rust-toolchain.toml .github/workflows/ci-android.yaml '.github/scripts/android-update-manifest*.py')
            git fetch --quiet origin "$latest"
            if ! git diff --quiet "$GITHUB_SHA" "$latest" -- "${paths[@]}"; then
              echo "A newer main commit changes Android; skip this older build."
              exit 0
            fi
            echo "Newer main commits do not change Android; publish this build."
          fi
          # 過去の実行の再実行などで、公開済みより古い版の更新情報に戻さない。端末は versionCode が
          # 現在より大きいときだけ更新するので、戻すと、後から入った変更を取り込めなくなる。
          # 公開済みの版を確かめられないとき (通信・権限・サーバーの障害、不正な JSON) は、公開を止める。
          # 公開済みがないと分かる場合 (release か update.json がない初回) だけ、0 として公開する。
          published=0
          if release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/android-main" 2>"$RUNNER_TEMP/gh-release.err"); then
            if [ "$(printf '%s' "$release" | jq '[.assets[] | select(.name == "update.json")] | length')" -gt 0 ]; then
              manifest=$(gh release download android-main --repo "$GITHUB_REPOSITORY" --pattern update.json --output -)
              published=$(printf '%s' "$manifest" | python3 -c 'import json, sys; print(int(json.load(sys.stdin)["versionCode"]))')
            fi
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/gh-release.err"; then
            echo "No android-main release yet."
          else
            cat "$RUNNER_TEMP/gh-release.err"
            echo "::error::Could not read the published release; stop to avoid replacing a newer update.json."
            exit 1
          fi
          version_code=$(python3 -c 'import json, sys; print(int(json.load(open(sys.argv[1]))["versionCode"]))' "$RUNNER_TEMP/update.json")
          if [ "$published" -ge "$version_code" ]; then
            echo "Published versionCode $published is not older than $version_code; skip this build."
            exit 0
          fi
          if ! gh release view android-main --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create android-main --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Android main" --notes "main の署名付き Android ビルド。更新対象のコミットとバージョンは update.json を参照してください。"
          fi
          gh release upload android-main "$RUNNER_TEMP/zoo-android-main-$GITHUB_SHA.apk" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload android-main "$RUNNER_TEMP/update.json" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Remove the signing key
        if: always()
        run: python3 -c 'import os; from pathlib import Path; (Path(os.environ["RUNNER_TEMP"]) / "zoo-release.jks").unlink(missing_ok=True)'
