name: Select tests
on:
  workflow_call:
    outputs:
      frontend:
        description: Frontend test suites selected from the complete PR diff
        value: ${{ jobs.select.outputs.frontend }}
      backend:
        description: Backend integration test targets and partitions
        value: ${{ jobs.select.outputs.backend }}
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.select.outputs.frontend }}
      backend: ${{ steps.select.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # A PR merge commit normally has the event base as its first parent.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Test Selection regression tests
        run: node --test .github/scripts/frontend-test-selection.test.mjs .github/scripts/test-selection.test.mjs
      - id: select
        run: node .github/scripts/test-selection.mjs
