name: Check DB ER diagram

on:
  # merge-queue.yaml がマージキューで呼び出す。
  workflow_call:
  pull_request:
    paths:
      - infra/db/schema.sql
      - infra/db/atlas.hcl
      - infra/db/erd.sh
      - docs/db-erd.md
      - docs/db-erd/**
      - .github/workflows/ci-db-erd.yaml
      - .github/workflows/select-runner.yaml
  push:
    branches: [main]
    paths:
      - infra/db/schema.sql
      - infra/db/atlas.hcl
      - infra/db/erd.sh
      - docs/db-erd.md
      - docs/db-erd/**
      - .github/workflows/ci-db-erd.yaml
      - .github/workflows/select-runner.yaml

permissions:
  contents: read

concurrency:
  group: ci-db-erd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    uses: ./.github/workflows/select-runner.yaml
    secrets:
      runner-status-token: ${{ secrets.RUNNER_STATUS_TOKEN }}

  check:
    needs: runner
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.docker-runs-on || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Atlas
        uses: ariga/setup-atlas@v0
        with:
          # 生成物を文字単位で比べるので、開発シェル (flake.nix の nixpkgs の atlas) と版をそろえる。
          version: v1.3.0

      - name: Check ER diagram is up to date
        run: infra/db/erd.sh --check
