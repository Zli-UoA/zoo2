name: Validate preview automation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/images.test.mjs .github/scripts/preview.test.mjs .github/scripts/preview-lifecycle.test.mjs
