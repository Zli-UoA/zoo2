name: Select runner

# Workload priority: kubecamp -> zli-k8s -> hosted; Docker jobs skip kubecamp.
# CI_RUNNER now only chooses the selector host, not the workload destination.
on:
  workflow_call:
    secrets:
      runner-status-token:
        required: false
    outputs:
      runs-on:
        description: JSON for Docker-free jobs
        value: ${{ jobs.select.outputs.runs-on }}
      docker-runs-on:
        description: JSON for jobs requiring a Docker daemon
        value: ${{ jobs.select.outputs.docker-runs-on }}
      large-runs-on:
        description: JSON for jobs exceeding the 2GiB kubecamp memory limit
        value: ${{ jobs.select.outputs.docker-runs-on }}

permissions:
  contents: read

jobs:
  select:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_SELECTOR_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 3
    continue-on-error: true
    permissions: {}
    outputs:
      runs-on: ${{ steps.select.outputs.runs-on }}
      docker-runs-on: ${{ steps.select.outputs.docker-runs-on }}
    steps:
      # No checkout: the status token never reaches repository code.
      - uses: actions/github-script@v8
        id: select
        env:
          HAS_STATUS_TOKEN: ${{ secrets.runner-status-token != '' }}
        with:
          github-token: ${{ secrets.runner-status-token || github.token }}
          script: |
            const KUBECAMP = 'zli-kubecamp-no-docker';
            const SCALE_SET = 'zli-k8s';
            const HOSTED = 'ubuntu-latest';
            const use = (runsOn, dockerRunsOn, reason) => {
              core.setOutput('runs-on', JSON.stringify(runsOn));
              core.setOutput('docker-runs-on', JSON.stringify(dockerRunsOn));
              core.info(`Docker-free: ${runsOn}; Docker: ${dockerRunsOn}: ${reason}`);
            };
            const pr = context.payload.pull_request;
            // Fork code uses hosted runners; pull_request_target never checks out PR code.
            if (context.eventName === 'pull_request' && pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              return use(HOSTED, HOSTED, 'fork pull request');
            }
            // Unknown availability keeps the first eligible self-hosted pool.
            if (process.env.HAS_STATUS_TOKEN !== 'true') {
              return use(KUBECAMP, SCALE_SET, 'RUNNER_STATUS_TOKEN is not set');
            }
            let runners;
            try {
              runners = await github.paginate(github.rest.actions.listSelfHostedRunnersForOrg, {
                org: context.repo.owner, per_page: 100, request: {timeout: 10000},
              });
            } catch (error) {
              core.warning(`Runner status unavailable (${error.status || 'network error'})`);
              return use(KUBECAMP, SCALE_SET, 'runner status unavailable');
            }
            const online = runners.filter(r => r.status === 'online');
            const hasLabel = (r, name) => (r.labels || []).some(l => l.name === name);
            const kubecamp = online.filter(r => hasLabel(r, KUBECAMP) && !r.busy);
            const arc = online.filter(r => r.name.startsWith(`${SCALE_SET}-`) || hasLabel(r, SCALE_SET));
            // Ephemeral registrations do not reveal assigned jobs; only an idle ARC is available.
            const arcAvailable = arc.some(r => !r.busy);
            const dockerRunsOn = arcAvailable ? SCALE_SET : HOSTED;
            return use(kubecamp.length > 0 ? KUBECAMP : dockerRunsOn, dockerRunsOn,
              `${kubecamp.length} idle kubecamp, ${arc.length} online ARC, ${arc.filter(r => !r.busy).length} idle ARC`);
