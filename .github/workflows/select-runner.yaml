name: Select runner

# Public repositories use hosted runners without availability/billing API calls.
# Private workload priority: kubecamp -> hosted -> zli-k8s. Docker/large jobs
# skip kubecamp; hosted availability depends on the included minutes.
# CI_RUNNER now only chooses the selector host, not the workload destination.
on:
  workflow_call:
    inputs:
      # large-runs-on を使う workflow だけ true にする。true のときだけ、heavy の使用状況を API で読む。
      large:
        type: boolean
        default: false
    secrets:
      runner-status-token:
        required: false
    outputs:
      runs-on:
        description: JSON for Docker-free jobs
        value: ${{ jobs.select.outputs.runs-on }}
      docker-runs-on:
        description: JSON for jobs requiring a Docker daemon
        value: ${{ jobs.select.outputs.docker-runs-on }}
      large-runs-on:
        description: JSON for jobs exceeding the 2GiB kubecamp memory limit
        value: ${{ jobs.select.outputs.large-runs-on }}

permissions:
  contents: read

jobs:
  select:
    runs-on: ${{ (github.event.repository.private == false || github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || vars.CI_SELECTOR_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      actions: read
    outputs:
      runs-on: ${{ steps.select.outputs.runs-on }}
      docker-runs-on: ${{ steps.select.outputs.docker-runs-on }}
      large-runs-on: ${{ steps.select.outputs.large-runs-on }}
    steps:
      # No checkout: the status token never reaches repository code.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: select
        env:
          HAS_STATUS_TOKEN: ${{ secrets.runner-status-token != '' }}
          LARGE_RUNNER: ${{ vars.CI_LARGE_RUNNER }}
          LARGE_CALLER: ${{ inputs.large }}
        with:
          github-token: ${{ secrets.runner-status-token || github.token }}
          script: |
            const KUBECAMP = 'zli-kubecamp-no-docker';
            const SCALE_SET = 'zli-k8s';
            const HOSTED = 'ubuntu-latest';
            const LARGE_RUNNER = 'zli-k8s-heavy';
            // zoo2-infra の zli-k8s-zoo2-heavy の maxRunners と同じ値にする。
            const HEAVY_RUNNERS = 2;
            // 重いジョブ（large-runs-on）を持つ workflow。merge group は Hosted 固定なので、数えない。
            const LARGE_WORKFLOWS = ['ci-backend.yaml', 'ci-frontend.yaml'];
            const MAX_HEAVY_API_CALLS = 30;
            // select ジョブの timeout-minutes（3分）に収める。超えたら heavy の使用状況は不明として扱う。
            const HEAVY_TIMEOUT_MS = Number(process.env.HEAVY_TIMEOUT_MS) || 20000;
            // Included minutes of GitHub Free for private repositories; the margin
            // covers billing lag and jobs started after the check. Every OS draws on
            // the same allowance by price, so usage is counted in Linux minutes.
            const HOSTED_INCLUDED_MINUTES = 2000;
            const HOSTED_MARGIN_MINUTES = 100;
            const LINUX_MINUTE_PRICE = 0.006;
            const org = context.repo.owner;
            const request = {timeout: 10000};
            const use = (runsOn, hostedRunsOn, reason, largeRunsOn = hostedRunsOn) => {
              core.setOutput('runs-on', JSON.stringify(runsOn));
              core.setOutput('docker-runs-on', JSON.stringify(hostedRunsOn));
              core.setOutput('large-runs-on', JSON.stringify(largeRunsOn));
              core.info(`Docker-free: ${runsOn}; Docker: ${hostedRunsOn}; large: ${largeRunsOn}: ${reason}`);
            };
            // heavy の runner が使っている台数（実行中と待ちの、zli-k8s-heavy のジョブ）。Runner の一覧は読まず、
            // 公開リポジトリの Actions のジョブから数える（Runner の一覧には、リポジトリの管理権限が要るため）。
            const heavyJobs = async () => {
              const {owner, repo} = context.repo;
              let busy = 0;
              let calls = 0;
              const seen = new Set();
              for (const workflow_id of LARGE_WORKFLOWS) {
                for (const status of ['in_progress', 'queued']) {
                  const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {owner, repo, workflow_id, status, per_page: 100, request});
                  for (const run of runs) {
                    // 2つの status の問い合わせの間に queued から in_progress へ移った run を、2回数えない。
                    if (run.id === context.runId || seen.has(run.id)) continue;
                    seen.add(run.id);
                    if (++calls > MAX_HEAVY_API_CALLS) {
                      core.warning(`Heavy runner usage is partial: stopped after ${MAX_HEAVY_API_CALLS} job lists`);
                      return busy;
                    }
                    const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {owner, repo, run_id: run.id, filter: 'latest', per_page: 100, request});
                    busy += jobs.filter(j => ['queued', 'in_progress'].includes(j.status) && (j.labels || []).includes(LARGE_RUNNER)).length;
                    if (busy >= HEAVY_RUNNERS) return busy;
                  }
                }
              }
              return busy;
            };
            // API が遅いと、1回ごとの timeout（10秒）に収まったまま、全体で select ジョブの timeout を超えうる。
            const heavyJobsWithin = async () => {
              let timer;
              try {
                return await Promise.race([heavyJobs(), new Promise((_, reject) => {
                  timer = setTimeout(() => reject(Object.assign(new Error('heavy usage timed out'), {status: 'timeout'})), HEAVY_TIMEOUT_MS);
                })]);
              } finally {
                clearTimeout(timer);
              }
            };
            const pr = context.payload.pull_request;
            // Fork code uses hosted runners; pull_request_target never checks out PR code.
            if (context.eventName === 'pull_request' && pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              return use(HOSTED, HOSTED, 'fork pull request');
            }
            if (context.eventName === 'merge_group') {
              return use(HOSTED, HOSTED, 'merge group');
            }
            // An idle self-hosted runner is not a reservation. Fan-out can queue
            // behind other workflows before dispatch, so public CI uses hosted.
            if (context.payload.repository?.private === false) {
              // 重いジョブだけ、Actions variable CI_LARGE_RUNNER で、大きな runner（zoo2-infra の zli-k8s-heavy）に切り替えられる。
              // 空なら Hosted。fork の PR と merge group は、上で Hosted に固定している。
              const large = (process.env.LARGE_RUNNER || '').trim();
              if (large && large !== LARGE_RUNNER) core.warning(`CI_LARGE_RUNNER must be empty or ${LARGE_RUNNER}; using hosted`);
              let largeRunsOn = large === LARGE_RUNNER ? LARGE_RUNNER : HOSTED;
              let reason = 'public repository; no self-hosted queue';
              if (largeRunsOn === LARGE_RUNNER && process.env.LARGE_CALLER !== 'true') {
                // large-runs-on を読まない workflow では、heavy の使用状況を読まない（API の呼び出しを無駄にしない）。
                largeRunsOn = HOSTED;
              }
              if (largeRunsOn === LARGE_RUNNER) {
                // heavy は埋まっている（実行中と待ちの重いジョブが HEAVY_RUNNERS 件以上）なら Hosted に逃がす。
                // 選択は workflow の開始時に一度だけなので、予約ではない。同時に始まる workflow は同じ結果を見て、
                // どちらも heavy を選びうる。API を読めないときは heavy のままにする（変数で heavy を指定した意図に従う）。
                try {
                  const busy = await heavyJobsWithin();
                  if (busy >= HEAVY_RUNNERS) {
                    largeRunsOn = HOSTED;
                    reason += `; ${LARGE_RUNNER} busy (${busy}/${HEAVY_RUNNERS})`;
                  }
                } catch (error) {
                  core.warning(`Heavy runner usage unavailable (${error.status || 'network error'}); using ${LARGE_RUNNER}`);
                }
              }
              return use(HOSTED, HOSTED, reason, largeRunsOn);
            }
            const hasToken = process.env.HAS_STATUS_TOKEN === 'true';
            // Hosted is free for public repositories. Private ones share the monthly
            // included minutes and cannot start hosted jobs once they run out.
            const checkHosted = async () => {
              if (!hasToken) return [false, 'hosted minutes unknown'];
              // Name the failing call and the permissions GitHub accepts for it.
              let endpoint = 'GET /orgs/{org}/repos';
              try {
                const repos = await github.paginate(github.rest.repos.listForOrg, {org, type: 'private', per_page: 100, request});
                const names = new Set(repos.map(r => r.name.toLowerCase()));
                const now = new Date();
                endpoint = 'GET /organizations/{org}/settings/billing/usage';
                const {data} = await github.request(endpoint, {
                  org, year: now.getUTCFullYear(), month: now.getUTCMonth() + 1, request,
                });
                const amount = (data.usageItems || [])
                  // Responses have used both 'actions' / 'repo' and 'Actions' / 'owner/repo'.
                  // Compute is billed in minutes; storage is not part of the allowance.
                  .filter(i => /^actions$/i.test(i.product) && /^minutes$/i.test(i.unitType) &&
                    names.has(String(i.repositoryName).split('/').pop().toLowerCase()))
                  .reduce((sum, i) => sum + i.grossAmount, 0);
                const minutes = amount / LINUX_MINUTE_PRICE;
                return [minutes < HOSTED_INCLUDED_MINUTES - HOSTED_MARGIN_MINUTES,
                  `private hosted minutes ${Math.round(minutes)}/${HOSTED_INCLUDED_MINUTES}`];
              } catch (error) {
                const accepted = error.response?.headers?.['x-accepted-github-permissions'];
                core.warning(`Hosted minutes unavailable: ${endpoint} (${error.status || 'network error'}` +
                  `${accepted ? `; accepted permissions: ${accepted}` : ''})`);
                return [false, 'hosted minutes unavailable'];
              }
            };
            const [hostedAvailable, minutes] = await checkHosted();
            const hostedRunsOn = hostedAvailable ? HOSTED : SCALE_SET;
            // Unknown kubecamp availability keeps the first eligible pool.
            if (!hasToken) {
              return use(KUBECAMP, hostedRunsOn, `RUNNER_STATUS_TOKEN is not set; ${minutes}`);
            }
            let runners;
            try {
              runners = await github.paginate(github.rest.actions.listSelfHostedRunnersForOrg, {org, per_page: 100, request});
            } catch (error) {
              core.warning(`Runner status unavailable (${error.status || 'network error'})`);
              return use(KUBECAMP, hostedRunsOn, `runner status unavailable; ${minutes}`);
            }
            const kubecamp = runners.filter(r => r.status === 'online' && !r.busy &&
              (r.labels || []).some(l => l.name === KUBECAMP));
            return use(kubecamp.length > 0 ? KUBECAMP : hostedRunsOn, hostedRunsOn,
              `${kubecamp.length} idle kubecamp; ${minutes}`);
