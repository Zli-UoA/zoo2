name: automerge-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, auto_merge_enabled, auto_merge_disabled]
  pull_request_target:
    types: [opened, synchronize, reopened, auto_merge_enabled, auto_merge_disabled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    # Explicit list excludes this gate itself and prevents event recursion.
    workflows:
      - "CI"
      - "CI Android"
      - "CI Crypto"
      - "CI Desktop Tauri"
      - "CI Frontend"
      - "CI Frontend Auth E2E"
      - "CI Frontend E2EE E2E"
      - "CI GitHub Bot"
      - "CI TUI"
      - "Check DB ER diagram"
      - "DB ER diagram"
      - "Deployment badges"
      - "Home query budget"
      - "OpenTofu R2"
      - "Read state and worker query budget"
      - "Validate Flux production status"
    types: [requested, in_progress, completed]
  check_run:
    types: [created, completed, rerequested]
  check_suite:
    types: [completed, rerequested]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request to re-evaluate once
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name != github.repository) &&
      (github.event_name != 'check_run' || github.event.check_run.app.slug != 'github-actions') &&
      (github.event_name != 'check_suite' || github.event.check_suite.app.slug != 'github-actions')
    concurrency:
      group: gate-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.event.check_run.head_sha || github.event.check_suite.head_sha || inputs.pull_number || github.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      checks: read
      pull-requests: read
      actions: read
    steps:
      # Privileged workflow_run/fork events only execute trusted default-branch
      # code. Same-repository PRs/reviews and explicit dispatch can validate gate edits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && github.event.pull_request.head.repo.full_name == github.repository && github.sha || github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Gate regression tests
        run: node --test .github/scripts/automerge-gate.test.mjs
      - name: Evaluate once and release the runner
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const {default: gate} = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/automerge-gate.mjs`);
            await gate({github, context, core});
