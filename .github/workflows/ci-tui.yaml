name: CI TUI
on:
  # merge-queue.yaml がマージキューで呼び出す。
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "client-core/**"
      - "client-types/**"
      - "desktop/**"
      - "tui/**"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-tui.yaml"
      - ".github/workflows/select-runner.yaml"
  push:
    branches: [main]
    paths:
      - "client-core/**"
      - "client-types/**"
      - "desktop/**"
      - "tui/**"
      - "rust-toolchain.toml"
      - ".github/workflows/ci-tui.yaml"
      - ".github/workflows/select-runner.yaml"
permissions:
  contents: read
concurrency:
  group: tui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# TUI は DB や Electric を使わないので、Docker 不要の実行先で fmt・clippy・テストをまとめて行います。
jobs:
  runner:
    uses: ./.github/workflows/select-runner.yaml
    secrets:
      runner-status-token: ${{ secrets.RUNNER_STATUS_TOKEN }}

  check:
    needs: runner
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event_name == 'merge_group') && 'ubuntu-latest' || fromJSON(needs.runner.outputs.runs-on || '"zli-kubecamp-no-docker"') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./tui
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Rust toolchain
        id: rust-toolchain
        working-directory: .
        # Install only the toolchain pinned in rust-toolchain.toml, not stable as well.
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: clippy, rustfmt
          # client-types は Tauri 版の WebView 側 (Leptos) でも使うため、wasm32 でも確かめる。
          targets: wasm32-unknown-unknown
      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui
      - name: format check (client-types)
        working-directory: ./client-types
        run: cargo fmt --check
      - name: lint check (client-types)
        working-directory: ./client-types
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test (client-types)
        working-directory: ./client-types
        run: cargo test --locked
      - name: wasm32 build check (client-types)
        working-directory: ./client-types
        run: cargo check --locked --target wasm32-unknown-unknown
      - name: format check (client-core)
        working-directory: ./client-core
        run: cargo fmt --check
      - name: lint check (client-core)
        working-directory: ./client-core
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test (client-core)
        working-directory: ./client-core
        run: cargo test --locked
      - name: format check
        run: cargo fmt --check
      - name: lint check
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --locked
      - name: build
        run: cargo build --locked --release

  desktop:
    # GPUI のビルドには Wayland / X11 / xkbcommon などの apt パッケージが要るため、GitHub ホストの実行先を使う。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev
      - name: Read Rust toolchain
        id: rust-toolchain
        working-directory: .
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: clippy, rustfmt
      - name: Restore Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: format check
        run: cargo fmt --check
      - name: lint check
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --locked
