name: Zoo
options:
  bundleIdPrefix: works.zli
  developmentLanguage: ja
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '9'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: F82XB5KFX2
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 157.0.0
targets:
  Zoo:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    dependencies:
      - package: WebRTC
      - target: ZooNotificationService
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.zli.zoo
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS: Zoo.entitlements
        APNS_ENVIRONMENT: development
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_CFBundleDisplayName: Zoo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      configs:
        Release:
          APNS_ENVIRONMENT: production
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: このバージョンではカメラを使用しません。音声通話はマイクのみを使用します。
        NSMicrophoneUsageDescription: チャンネルやDMの音声通話でマイクを使用します。
        NSSiriUsageDescription: SiriからDMを送信するため、宛先の名前と送信するメッセージをSiriと共有します。
        INIntentsSupported: [INSendMessageIntent]
        INIntentsRestrictedWhileLocked: [INSendMessageIntent]
        INIntentsRestrictedWhileProtectedDataUnavailable: [INSendMessageIntent]
        NSPhotoLibraryAddUsageDescription: アップロードされた画像や動画を写真に保存します。
        UIBackgroundModes: [audio, voip]
        APNSEnvironment: $(APNS_ENVIRONMENT)
        ZooPreviewKeychainGroup: $(AppIdentifierPrefix)works.zli.zoo.preview
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  ZooNotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.zli.zoo.notification-service
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: NotificationService.entitlements
    info:
      path: NotificationService-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Zoo
        ZooPreviewKeychainGroup: $(AppIdentifierPrefix)works.zli.zoo.preview
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  ZooTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Zoo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  ZooUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Zoo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1,2'
schemes:
  Zoo:
    build:
      targets:
        Zoo: all
    test:
      targets: [ZooTests, ZooUITests]
      gatherCoverageData: true
