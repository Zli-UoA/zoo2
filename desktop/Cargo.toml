[package]
name = "zoo2-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "zoo2 のデスクトップクライアント"
homepage = "https://github.com/Zli-UoA/zoo2/tree/main/desktop"
repository = "https://github.com/Zli-UoA/zoo2"

[profile.release]
strip = true

[dependencies]
zoo2-client-core = { path = "../client-core" }
anyhow = "1"
gpui = "0.2.2"

[lib]
name = "zoo2_desktop"
path = "src/lib.rs"

[[bin]]
name = "zoo2-desktop"
path = "src/main.rs"
