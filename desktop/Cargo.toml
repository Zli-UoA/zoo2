[package]
name = "zoo2-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "zoo2 のデスクトップクライアント"
homepage = "https://github.com/Zli-UoA/zoo2/tree/main/desktop"
repository = "https://github.com/Zli-UoA/zoo2"

[profile.release]
strip = true

[dependencies]
zoo2-client-core = { path = "../client-core" }
anyhow = "1"
emojis = "0.6"
futures = "0.3"
gpui = "0.2.2"
jiff = "0.2"
notify-rust = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"

[lib]
name = "zoo2_desktop"
path = "src/lib.rs"

[[bin]]
name = "zoo2-desktop"
path = "src/main.rs"
