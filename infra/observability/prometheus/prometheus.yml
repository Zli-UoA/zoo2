global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ローカルで `make backend-dev` 等として起動しているバイナリ群をスクレイプする。
  # コンテナ版を使う場合は環境変数 / override でターゲットを差し替える。
  - job_name: zoo-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9464"]
        labels:
          service: zoo-backend

  - job_name: zoo-dispatcher
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          service: zoo-dispatcher

  - job_name: zoo-slack-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels:
          service: zoo-slack-worker
