# CI だけで使う。compose の build が、GitHub Actions のキャッシュ（type=gha）から
# レイヤーを取り込む。書き込みは compose.ci-cache-write.yaml で、main のときだけ足す
# （PR で書くと、リポジトリのキャッシュ容量の上限を超えて、main のキャッシュも追い出される）。
# 使うには docker-container ドライバーの buildx と、ACTIONS_RESULTS_URL と ACTIONS_RUNTIME_TOKEN が要る。
#
# frontend だけに使う。deps のインストールと wasm-bindgen-cli のビルドが、再利用できる重いレイヤーだから。
# backend は、コンパイルを cache mount（と buildkit-cache-dance）で済ませ、ソースの COPY が毎回変わるので、
# レイヤーに再利用できるものがない。proxy は COPY 1 行だけ。どちらも保存すると、
# 再利用されない blob が main のマージごとに増え、容量の上限（10GB）を圧迫して Rust のキャッシュを追い出す。
services:
  frontend:
    build:
      args:
        ZOO_BUILD_SHA: ${GITHUB_SHA:-}
      cache_from:
        - type=gha,scope=ci-compose-frontend
