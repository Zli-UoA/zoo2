# ポート公開を含まない共通定義。ローカル用 compose.yml とステージング用 compose.stg.yaml が extends する。
name: zoo2

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-zoo}
    command:
      - postgres
      - -c
      - wal_level=logical
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  electric:
    image: electricsql/electric:${ELECTRIC_VERSION:-1.8.1}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-zoo}?sslmode=disable
      ELECTRIC_INSECURE: "true"
      ELECTRIC_FEATURE_FLAGS: "allow_subqueries"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
