name: zoo2

# ローカル開発用。共通定義 (compose.base.yml) にホスト側ポート公開だけを足す。
services:
  postgres:
    extends:
      file: compose.base.yml
      service: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  electric:
    extends:
      file: compose.base.yml
      service: electric
    ports:
      - "127.0.0.1:${ELECTRIC_PORT:-3000}:3000"

volumes:
  postgres-data:
