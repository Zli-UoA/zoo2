server {
  listen 3000;
  root /usr/share/nginx/html;

  # 遅延取得する Emoji Kitchen カタログを JSON のまま gzip 圧縮して配信する。
  gzip on;
  gzip_types application/json;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;

  # nginx は location 内で add_header を使うと親ブロックの add_header を継承しないため、
  # 各 location にセキュリティヘッダを併記する。
  # CSP の値はコンテナ起動時に envsubst で埋める（/etc/nginx/templates）。
  # - CSP_SCRIPT_SRC: ビルド時の index.html から生成したインライン script のハッシュ
  #   （Dockerfile のビルド時に infra/csp-hashes.mjs が生成する）
  # - CSP_CONNECT_SRC: Kanidm の issuer / token など、SPA が直接叩く追加オリジン。
  #   未設定なら同一オリジンのみ（既定）。値は空白区切り（例: https://idm.example.com）
  #
  # `style-src` の 'unsafe-inline' は React の style 属性（Composer の高さ調整など）
  # に必要。script 側はハッシュで許可し、'unsafe-inline' は使わない。
  # `img-src` の https://www.gstatic.com は Emoji Kitchen の合成画像（#82）用。
  # 画像はブラウザが Google から直接取得する。

  # ハッシュ付きのビルド成果物。存在しないファイルを index.html で返すと、
  # デプロイ後に古いタブが読み込む chunk が MIME エラーになり原因が分かりにくいため 404 にする。
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' ${CSP_SCRIPT_SRC}; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.gstatic.com; font-src 'self'; connect-src 'self' ${CSP_CONNECT_SRC}; object-src 'none'; base-uri 'self'; frame-src 'self' ${CSP_CONNECT_SRC}; frame-ancestors 'self'; form-action 'self'" always;
  }

  # SPA フォールバック。index.html は古いアセットを参照し続けないよう毎回再検証させる。
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' ${CSP_SCRIPT_SRC}; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.gstatic.com; font-src 'self'; connect-src 'self' ${CSP_CONNECT_SRC}; object-src 'none'; base-uri 'self'; frame-src 'self' ${CSP_CONNECT_SRC}; frame-ancestors 'self'; form-action 'self'" always;
  }
}
