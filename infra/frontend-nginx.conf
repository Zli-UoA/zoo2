server {
  listen 3000;
  root /usr/share/nginx/html;

  # 遅延取得する Emoji Kitchen カタログを JSON のまま gzip 圧縮して配信する。
  gzip on;
  gzip_types application/json;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;

  # nginx は location 内で add_header を使うと親ブロックの add_header を継承しないため、
  # 各 location にセキュリティヘッダを併記する。
  # CSP は OIDC PKCE 実装時に Kanidm への connect-src 等が確定した段階で設定する。

  # ハッシュ付きのビルド成果物。存在しないファイルを index.html で返すと、
  # デプロイ後に古いタブが読み込む chunk が MIME エラーになり原因が分かりにくいため 404 にする。
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }

  # SPA フォールバック。index.html は古いアセットを参照し続けないよう毎回再検証させる。
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }
}
