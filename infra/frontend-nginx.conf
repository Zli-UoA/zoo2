server {
  listen 3000;
  root /usr/share/nginx/html;

  # 遅延取得する Emoji Kitchen カタログを JSON のまま gzip 圧縮して配信する。
  gzip on;
  gzip_types application/json;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;

  # nginx は location 内で add_header を使うと親ブロックの add_header を継承しないため、
  # 各 location にセキュリティヘッダを併記する。
  # CSP の値はコンテナ起動時に envsubst で埋める（/etc/nginx/templates）。
  # - CSP_SCRIPT_SRC: ビルド時の index.html から生成したインライン script のハッシュ
  #   （Dockerfile のビルド時に infra/csp-hashes.mjs が生成する）
  # - CSP_CONNECT_SRC: Kanidm の issuer / token など、SPA が直接叩く追加オリジン。
  #   未設定なら同一オリジンのみ（既定）。値は空白区切り（例: https://idm.example.com）
  # - CSP_STORAGE_SRC: 添付ファイル用オブジェクトストレージ（Cloudflare R2 等）のオリジン。
  #   Presigned PUT/GET URL への fetch および画像表示のため connect-src と img-src に展開する（空白区切り）
  # - CSP_APP_IMAGE_SRC: App アイコンの HTTPS 配信元オリジン（img-src に展開、空白区切り）
  #
  # `style-src` の 'unsafe-inline' は React の style 属性（Composer の高さ調整など）
  # に必要。script 側はハッシュで許可し、'unsafe-inline' は使わない。
  # `img-src` の https://www.gstatic.com は Emoji Kitchen の合成画像（#82）用。
  # 画像はブラウザが Google から直接取得する。
  # SQLite Worker は埋め込み data: URL から WASM を読み込むため、connect-src の
  # data: と script-src の wasm-unsafe-eval が必要（JavaScript の eval は許可しない）。

  # ハッシュ付きのビルド成果物。存在しないファイルを index.html で返すと、
  # デプロイ後に古いタブが読み込む chunk が MIME エラーになり原因が分かりにくいため 404 にする。
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' ${CSP_SCRIPT_SRC}; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.gstatic.com ${CSP_STORAGE_SRC} ${CSP_APP_IMAGE_SRC} ${CSP_MEDIA_PROXY_SRC}; font-src 'self'; connect-src 'self' data: ${CSP_CONNECT_SRC} ${CSP_STORAGE_SRC} ${CSP_SUMMALY_SRC}; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  }

  location = /summaly-endpoint {
    default_type text/plain;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    return 200 "${SUMMALY_URL}";
  }

  # Public runtime configuration; never contains credentials.
  location = /media-proxy-endpoint {
    default_type text/plain;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    return 200 "${MEDIA_PROXY_URL}";
  }

  # SPA フォールバック。index.html は古いアセットを参照し続けないよう毎回再検証させる。
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' ${CSP_SCRIPT_SRC}; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.gstatic.com ${CSP_STORAGE_SRC} ${CSP_APP_IMAGE_SRC} ${CSP_MEDIA_PROXY_SRC}; font-src 'self'; connect-src 'self' data: ${CSP_CONNECT_SRC} ${CSP_STORAGE_SRC} ${CSP_SUMMALY_SRC}; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  }
}
