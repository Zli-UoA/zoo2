server {
  listen 3000;
  root /usr/share/nginx/html;

  # ハッシュ付きのビルド成果物。存在しないファイルを index.html で返すと、
  # デプロイ後に古いタブが読み込む chunk が MIME エラーになり原因が分かりにくいため 404 にする。
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA フォールバック。index.html は古いアセットを参照し続けないよう毎回再検証させる。
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
