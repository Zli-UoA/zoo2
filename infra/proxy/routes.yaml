# File-provider Go templates are expanded by Traefik at startup.
http:
  routers:
    apps:
      rule: 'PathPrefix(`/api/apps`) || PathPrefix(`/api/app-`)'
      priority: 200
      entryPoints: [web]
      middlewares: [app-private-response, strip-dev-headers]
      service: backend
    home-images:
      rule: 'Method(`GET`) && PathRegexp(`^/api/home/images/[^/]+$`)'
      priority: 150
      entryPoints: [web]
      middlewares: [home-image-response, strip-dev-headers]
      service: backend
    api:
      rule: 'Path(`/api`) || PathPrefix(`/api/`) || Path(`/.well-known/webfinger`)'
      priority: 100
      entryPoints: [web]
      middlewares: [private-response, strip-dev-headers]
      service: backend
    frontend:
      rule: 'PathPrefix(`/`)'
      priority: 1
      entryPoints: [web]
      service: frontend

  middlewares:
    # Revalidate visibility even while old backends still send cacheable redirects.
    home-image-response:
      headers:
        customResponseHeaders:
          Cache-Control: "private, no-cache, no-store"
    app-private-response:
      headers:
        customResponseHeaders:
          Cache-Control: "private, no-store"
    strip-dev-headers:
      headers:
        customRequestHeaders:
          X-Dev-User: ""
    private-response:
      headers:
        customResponseHeaders:
          Cache-Control: "private, no-cache"

  services:
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:3000
    backend:
      loadBalancer:
        servers:
          - url: 'http://backend:{{ env "BACKEND_PORT" }}'
        serversTransport: long-poll
        responseForwarding:
          flushInterval: -1ms
  serversTransports:
    long-poll:
      forwardingTimeouts:
        dialTimeout: 10s
        responseHeaderTimeout: 120s
        idleConnTimeout: 120s

