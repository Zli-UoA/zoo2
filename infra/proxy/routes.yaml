# File-provider Go templates are expanded by Traefik at startup.
http:
  routers:
    api:
      rule: 'Path(`/api`) || PathPrefix(`/api/`)'
      priority: 100
      entryPoints: [web]
      middlewares: [private-response, strip-dev-headers]
      service: backend
    ios:
      rule: 'Path(`/.well-known/apple-app-site-association`) || Path(`/ios/oauth/callback`)'
      priority: 100
      entryPoints: [web]
      middlewares: [strip-dev-headers]
      service: backend
    frontend:
      rule: 'PathPrefix(`/`)'
      priority: 1
      entryPoints: [web]
      service: frontend

  middlewares:
    strip-dev-headers:
      headers:
        customRequestHeaders:
          X-Dev-User: ""
    private-response:
      headers:
        customResponseHeaders:
          Cache-Control: "private, no-cache"

  services:
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:3000
    backend:
      loadBalancer:
        servers:
          - url: 'http://backend:{{ env "BACKEND_PORT" }}'
        serversTransport: long-poll
        responseForwarding:
          flushInterval: -1ms
  serversTransports:
    long-poll:
      forwardingTimeouts:
        dialTimeout: 10s
        responseHeaderTimeout: 120s
        idleConnTimeout: 120s

