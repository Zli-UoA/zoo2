name: zoo2-stg

# Coolify は `extends` や `!reset` などを正しく扱えないため、DB 定義はこのファイルに展開している。
# ローカル用の infra/db/compose.yml と内容を合わせること (ホスト側ポート公開は行わない)。
services:
  proxy:
    image: ${PROXY_IMAGE:-zoo-proxy:stg}
    build:
      context: .
      dockerfile: infra/Dockerfile-proxy-deploy
    restart: unless-stopped
    environment:
      BACKEND_PORT: ${PORT:-8000}
    command:
      - --entrypoints.web.address=:8080
      - --entrypoints.web.transport.respondingtimeouts.readtimeout=120s
      # writeTimeout はリクエスト開始から応答を書き終えるまでの期限で、長く続く
      # Shape のストリーム (SSE など) を打ち切るため無効にする。バックエンドの
      # 応答待ちは routes.yaml の long-poll.responseHeaderTimeout が担う。
      - --entrypoints.web.transport.respondingtimeouts.writetimeout=0s
      - --entrypoints.health.address=:8082
      - --ping.entrypoint=health
      - --providers.file.filename=/etc/traefik/routes.yaml
    # Coolify Single Resource Tunnel (cloudflared uses host networking).
    # Avoid Coolify's own 8080; expose only the ingress on host loopback.
    ports:
      - "127.0.0.1:${PROXY_PORT:-18080}:8080"
    networks:
      - frontend
      - backend
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      # Keep health entrypoint name/address in sync with command above.
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=health", "--entrypoints.health.address=:8082"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE:-zoo-frontend:stg}
    build:
      context: .
      dockerfile: infra/Dockerfile-frontend-deploy
      args:
        VITE_API_BASE_URL: ""
        # SPA の OIDC PKCE 設定。未設定（空）なら dev の X-Dev-User のまま。
        VITE_OIDC_ISSUER: ${VITE_OIDC_ISSUER:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-}
        VITE_OIDC_RESOURCE: ${VITE_OIDC_RESOURCE:-}
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${VITE_OIDC_POST_LOGOUT_REDIRECT_URI:-}
    restart: unless-stopped
    environment:
      # CSP の connect-src に足す IdP のオリジン（空白区切り）。未設定なら同一オリジンのみ。
      # 例: https://idm.example.com
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
      # CSP の connect-src / img-src に足す添付ファイル用ストレージ（R2 等）のオリジン（空白区切り）。
      CSP_STORAGE_SRC: ${CSP_STORAGE_SRC:-}
      CSP_APP_IMAGE_SRC: ${CSP_APP_IMAGE_SRC:-}
      MEDIA_PROXY_URL: ${MEDIA_PROXY_URL:-}
    networks:
      - frontend

  backend:
    image: ${BACKEND_IMAGE:-zoo-backend:stg}
    build:
      context: .
      dockerfile: infra/Dockerfile-backend-deploy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zoo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-zoo}?sslmode=disable
      ELECTRIC_URL: http://electric:3000
      PORT: ${PORT:-8000}
      ENVIRONMENT: production
      DEV_AUTH_ENABLED: "false"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      APP_S3_ENDPOINT: ${APP_S3_ENDPOINT:-}
      APP_S3_BUCKET: ${APP_S3_BUCKET:-}
      APP_S3_REGION: ${APP_S3_REGION:-}
      APP_S3_ACCESS_KEY_ID: ${APP_S3_ACCESS_KEY_ID:-}
      APP_S3_SECRET_ACCESS_KEY: ${APP_S3_SECRET_ACCESS_KEY:-}
      # Pass through configured OIDC values; keep missing keys unset so Rust's
      # production validation and OIDC_CLIENT_ID fallback still apply.
      OIDC_ISSUER:
      OIDC_AUDIENCE:
      OIDC_CLIENT_ID:
      OIDC_JWKS_URL:
      # S3 / Cloudflare R2 storage settings for attachments
      S3_ENDPOINT:
      S3_BUCKET:
      S3_REGION:
      S3_ACCESS_KEY_ID:
      S3_SECRET_ACCESS_KEY:
      S3_FORCE_PATH_STYLE:
    networks:
      - backend
      - backend-egress
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      electric:
        condition: service_healthy

  migrate:
    image: ${MIGRATE_IMAGE:-zoo-migrate:stg}
    build:
      context: .
      dockerfile: infra/Dockerfile-migrate-deploy
    restart: "no"
    networks:
      - backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zoo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-zoo}?sslmode=disable
    command:
      - migrate
      - apply
      - --config
      - file:///db/atlas.hcl
      - --env
      - local
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-zoo}
    command:
      - postgres
      - -c
      - wal_level=logical
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  electric:
    image: electricsql/electric:${ELECTRIC_VERSION:-1.8.1}
    restart: unless-stopped
    networks:
      - backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zoo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-zoo}?sslmode=disable
      ELECTRIC_INSECURE: "true"
      ELECTRIC_FEATURE_FLAGS: "allow_subqueries"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:

networks:
  frontend:
  backend:
    internal: true
  # Rust needs outbound HTTPS for Kanidm Discovery/JWKS.
  backend-egress:
