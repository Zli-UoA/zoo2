name: zoo2-stg

# Coolify は `extends` や `!reset` などを正しく扱えないため、DB 定義はこのファイルに展開している。
# ローカル用の infra/db/compose.yml と内容を合わせること (ホスト側ポート公開は行わない)。
services:
  proxy:
    image: ${PROXY_IMAGE:-zoo-proxy:stg}
    build:
      context: .
      dockerfile: infra/Dockerfile-proxy-deploy
    restart: unless-stopped
    environment:
      BACKEND_PORT: ${PORT:-8000}
      BFF_VERIFY_PATH: ${BFF_VERIFY_PATH:-/auth/verify}
      BFF_VERIFY_SECRET: ${BFF_VERIFY_SECRET:?BFF_VERIFY_SECRET is required}
    command:
      - --entrypoints.web.address=:8080
      - --entrypoints.web.forwardedheaders.trustedips=${PROXY_TRUSTED_IPS:-127.0.0.1/32}
      - --entrypoints.web.transport.respondingtimeouts.readtimeout=120s
      - --entrypoints.web.transport.respondingtimeouts.writetimeout=120s
      - --entrypoints.health.address=:8082
      - --ping.entrypoint=health
      - --providers.file.filename=/etc/traefik/routes.yaml
    # ホスト側ポートは公開しない。ローカル確認は infra/compose.stg.local.yaml を重ねる。
    networks:
      - frontend
      - backend
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=health", "--entrypoints.health.address=:8082"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE:-zoo-frontend:stg}
    build:
      context: .
      dockerfile: infra/Dockerfile-frontend-deploy
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    environment:
      BFF_VERIFY_SECRET: ${BFF_VERIFY_SECRET:?BFF_VERIFY_SECRET is required}
    networks:
      - frontend

  backend:
    image: ${BACKEND_IMAGE:-zoo-backend:stg}
    build:
      context: .
      dockerfile: infra/Dockerfile-backend-deploy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zoo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-zoo}?sslmode=disable
      ELECTRIC_URL: http://electric:3000
      PORT: ${PORT:-8000}
      ENVIRONMENT: production
      DEV_AUTH_ENABLED: "false"
    networks:
      - backend
      - backend-egress
    depends_on:
      postgres:
        condition: service_healthy
      electric:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-zoo}
    command:
      - postgres
      - -c
      - wal_level=logical
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  electric:
    image: electricsql/electric:${ELECTRIC_VERSION:-1.8.1}
    restart: unless-stopped
    networks:
      - backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zoo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-zoo}?sslmode=disable
      ELECTRIC_INSECURE: "true"
      ELECTRIC_FEATURE_FLAGS: "allow_subqueries"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:

networks:
  frontend:
  backend:
    internal: true
  # Rust needs outbound HTTPS for Kanidm Discovery/JWKS.
  backend-egress:
