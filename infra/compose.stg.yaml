name: zoo2-stg

services:
  backend:
    image: ${BACKEND_IMAGE:-zoo-backend:stg}
    build:
      context: .
      dockerfile: infra/Dockerfile-backend-deploy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zoo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-zoo}?sslmode=disable
      ELECTRIC_URL: http://electric:3000
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      electric:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-zoo}
    command:
      - postgres
      - -c
      - wal_level=logical
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  electric:
    image: electricsql/electric:${ELECTRIC_VERSION:-1.8.1}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zoo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-zoo}?sslmode=disable
      ELECTRIC_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
