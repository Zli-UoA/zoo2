[package]
name = "zoo2-desktop-tauri"
version = "0.2.2"
edition = "2024"
license = "MIT"
description = "zoo2 のデスクトップクライアント (Tauri)"
homepage = "https://github.com/Zli-UoA/zoo2/tree/main/desktop-tauri"
repository = "https://github.com/Zli-UoA/zoo2"

[lib]
name = "zoo2_desktop_tauri"
crate-type = ["rlib"]

[[bin]]
name = "zoo2-desktop-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zoo2-client-core = { path = "../../client-core" }
zoo2-client-types = { path = "../../client-types" }
anyhow = "1"
jiff = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
notify-rust = "4"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# UNUserNotificationCenter で通知を出す (起動時に通知の許可を求められる)。NSUserNotification は古く、許可を求められない。
notify-rust = { version = "4", features = ["preview-macos-un"] }

[target.'cfg(target_os = "linux")'.dependencies]
# 通話のため、WebKitGTK の WebRTC を有効にする (window.rs の enable_webrtc)。
webkit2gtk = { version = "2", features = ["v2_38"] }

[profile.release]
strip = true
