[package]
name = "backend"
version = "0.1.0"
edition = "2024"
# bin が 2 つあるので、`cargo run` の既定は backend 本体にする。
default-run = "zoo_backend"

[profile.release]
strip = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
toasty = { version = "0.11", features = ["postgresql", "jiff", "serde"] }
toasty-driver-postgresql = { version = "0.11", features = ["jiff"] }
jiff = { version = "0.2", features = ["serde"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = [
    "rt-tokio",
    "experimental_trace_batch_span_processor_with_async_runtime",
    "experimental_metrics_periodicreader_with_async_runtime",
    "experimental_logs_batch_log_processor_with_async_runtime",
] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-client", "reqwest-rustls", "trace", "metrics", "logs"] }
opentelemetry-http = "0.33"
opentelemetry-prometheus = "0.33"
opentelemetry-appender-tracing = "0.33"
prometheus = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
jsonwebtoken = "9"
emojis = "0.6"
imagesize = "0.14"
blurhash = "0.2"
aws-sdk-s3 = "1.154.0"
aws-credential-types = "1.3.1"
percent-encoding = "2.3.2"
hmac = "0.13"
sha2 = "0.11"
regex = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ece = "2.4"
aes-gcm = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Statically link OpenSSL so the distroless runtime needs no shared libcrypto.
openssl = { version = "0.10", features = ["vendored"] }

http-signature-normalization = "0.7.1"
httpdate = "1"
html-escape = "0.2"
# E2EE の鍵の署名の検証（docs/e2ee.md の「方針」）。クライアントと同じ実装を使う。
zoo-crypto = { path = "../crates/zoo-crypto" }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
# E2EE の結合テストで、クロス署名鍵の署名を作る（zoo-crypto と同じ版）。
vodozemac = "0.11.2"
tokio-tungstenite = "0.29"

[lib]
name = "backend"
path = "src/lib.rs"

[[bin]]
name = "zoo_backend"
path = "src/main.rs"

[[bin]]
name = "zoo_dispatcher"
path = "src/bin/zoo_dispatcher.rs"

[[bin]]
name = "zoo_slack_worker"
path = "src/bin/zoo_slack_worker.rs"
