[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
toasty = { version = "0.11", features = ["postgresql", "jiff", "serde"] }
toasty-driver-postgresql = { version = "0.11", features = ["jiff"] }
jiff = { version = "0.2", features = ["serde"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio-postgres = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
jsonwebtoken = "9"
emojis = "0.6"
hmac = "0.13"
sha2 = "0.11"
regex = "1"
base64 = "0.22"
ece = "2.4"
# Statically link OpenSSL so the distroless runtime needs no shared libcrypto.
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
wiremock = "0.6"
tokio-tungstenite = "0.29"

[lib]
name = "backend"
path = "src/lib.rs"

[[bin]]
name = "zoo_backend"
path = "src/main.rs"
