[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
toasty = { version = "0.11", features = ["postgresql", "jiff", "serde"] }
toasty-driver-postgresql = { version = "0.11", features = ["jiff"] }
jiff = { version = "0.2", features = ["serde"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio-postgres = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"

[lib]
name = "backend"
path = "src/lib.rs"

[[bin]]
name = "zoo_backend"
path = "src/main.rs"
