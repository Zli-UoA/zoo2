[package]
name = "zoo2-client-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "zoo2 の TUI・デスクトップクライアント共通ライブラリ"
homepage = "https://github.com/Zli-UoA/zoo2"
repository = "https://github.com/Zli-UoA/zoo2"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
toml = "0.8"
url = "2"
directories = "6"
jiff = "0.2"
futures-util = "0.3"
emojis = "0.6"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
wiremock = "0.6"
