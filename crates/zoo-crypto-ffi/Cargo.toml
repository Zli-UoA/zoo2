[package]
name = "zoo-crypto-ffi"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "zoo-crypto の UniFFI バインディング（Android の Kotlin から使う）"
repository = "https://github.com/Zli-UoA/zoo2"

# コアの crates/zoo-crypto とは別のクレートにして、コアに UniFFI の依存を入れない
# （docs/e2ee.md の「共有の暗号コア」）。
[lib]
name = "zoo_crypto_ffi"
# cdylib は Android の各 ABI の .so と、単体テストで JNA が読むホストの .so。
# lib は Rust のテスト（tests/）から使う。
crate-type = ["cdylib", "lib"]

[[bin]]
# Kotlin のバインディングを、ビルドした .so から作る（`--library` モード）。
# 版がライブラリーの uniffi と必ず一致するように、別のツールを入れずにこのクレートで持つ。
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
serde = "1"
serde_json = "1"
thiserror = "2"
uniffi = "0.32.2"
zeroize = "1.9.0"
zoo-crypto = { path = "../zoo-crypto" }

[dev-dependencies]
serde_json = "1"

[profile.release]
# Android の APK に入れる .so を小さくする。
lto = true
codegen-units = 1
strip = "symbols"
